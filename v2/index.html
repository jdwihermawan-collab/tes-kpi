<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lead Tracker">
<title>Lead Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  TAMPILAN BARU (/v2/) — data asli Firebase yang sama dengan tampilan lama (/).
  Logika (KPI, terima lead, cek nomor ganda, rekap hemat-read, lonceng) ada di core.js yang
  DISALIN OTOMATIS dari /index.html oleh scripts/build-v2-core.py. File ini hanya tampilan & alur.
-->
<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --fill:#EEEEF3; --fill2:#E5E5EA;
    --label:#1C1C1E; --label2:#6C6C70; --label3:#AEAEB2; --sep:rgba(60,60,67,.13);
    --tint:#2B45B8; --tint-soft:#E9EDFB;
    --green:#30A46C; --green-soft:#E6F6EE; --orange:#E8890C; --orange-soft:#FDF1E1; --red:#E5484D; --red-soft:#FDECEC;
    --r-card:18px; --r-row:14px; --r-btn:14px; --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased}
  body{min-height:100vh}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:disabled{opacity:.5}
  input,select,textarea{font:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  .app{max-width:440px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);overflow-x:hidden}
  .top{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 6px;background:rgba(242,242,247,.86);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px)}
  .top-row{display:flex;align-items:center;justify-content:space-between;min-height:36px}
  .top-mini{font-size:13px;color:var(--label2);font-weight:500}
  .icon-btn{width:36px;height:36px;border-radius:50%;background:var(--card);display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none}
  .icon-btn svg{width:19px;height:19px}
  .dot-badge{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--card)}
  .large-title{font-size:32px;font-weight:700;letter-spacing:-.02em;padding:4px 0 2px}
  .screen{padding:4px 16px calc(96px + var(--safe-b))}
  .section-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 8px;gap:8px}
  .section-h h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .section-h .link{font-size:15px;color:var(--tint);font-weight:500;white-space:nowrap}
  .foot{font-size:13px;color:var(--label2);margin:6px 16px 0;line-height:1.35}
  .card{background:var(--card);border-radius:var(--r-card);padding:16px}
  .group{background:var(--card);border-radius:var(--r-card);overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px;position:relative;width:100%;text-align:left}
  .row + .row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
  .row.ind + .row.ind::before{left:66px}
  button.row:active{background:var(--fill)}
  .row .main{flex:1;min-width:0}
  .row .t{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .s{font-size:13.5px;color:var(--label2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .v{font-size:14px;color:var(--label2);white-space:nowrap}
  .wrap{white-space:normal !important}
  .chev{width:8px;height:13px;flex:none;color:var(--label3)}
  .avatar{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;color:#fff}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
  .p-blue{background:var(--tint-soft);color:var(--tint)} .p-green{background:var(--green-soft);color:#1F7A4D}
  .p-orange{background:var(--orange-soft);color:#A55E00} .p-red{background:var(--red-soft);color:#C02B30} .p-gray{background:var(--fill);color:var(--label2)}
  .p-purple{background:#F1EAFB;color:#6B3FA0}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:var(--r-btn);font-weight:600;font-size:16.5px;width:100%}
  .btn-primary{background:var(--tint);color:#fff}
  .btn-primary:active{opacity:.85}
  .btn-tinted{background:var(--tint-soft);color:var(--tint)}
  .btn-danger{background:var(--red-soft);color:var(--red)}
  .btn-green{background:var(--green);color:#fff}
  .btn-plain{color:var(--tint);font-weight:500;font-size:16px;padding:6px 0}
  .field{background:var(--card);border-radius:var(--r-row);padding:0 16px;display:block}
  .field > span{display:block;font-size:12.5px;color:var(--label2);padding-top:9px}
  .field input,.field select,.field textarea{width:100%;border:0;outline:0;background:transparent;font-size:16.5px;padding:2px 0 10px;-webkit-appearance:none;appearance:none}
  .field textarea{resize:none;min-height:70px}
  .field + .field,.field + .grid2,.grid2 + .field{margin-top:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid2 .field{margin:0}
  .search{display:flex;align-items:center;gap:8px;background:var(--fill2);border-radius:12px;height:38px;padding:0 10px;color:var(--label2);flex:1}
  .search input{flex:1;border:0;outline:0;background:transparent;font-size:16px;min-width:0}
  .seg{display:flex;background:var(--fill2);border-radius:10px;padding:2px;margin-top:10px}
  .seg button{flex:1;height:30px;border-radius:8px;font-size:13.5px;font-weight:500}
  .seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
  .select-chip{background:var(--fill2);border-radius:10px;border:0;height:34px;padding:0 10px;font-size:14px;font-weight:500;outline:0;max-width:100%}
  .tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;z-index:30;display:flex;justify-content:space-around;
    padding:6px 8px calc(6px + var(--safe-b));background:rgba(249,249,251,.9);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--label3);padding:4px 0;position:relative}
  .tab svg{width:25px;height:25px}
  .tab.on{color:var(--tint)}
  .tab .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:440px;z-index:41;background:var(--bg);border-radius:22px 22px 0 0;max-height:93vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:0 16px calc(28px + var(--safe-b))}
  .sheet.on{transform:translate(-50%,0)}
  .grabber{width:38px;height:5px;border-radius:3px;background:var(--label3);opacity:.55;margin:8px auto 4px}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:4px 0 12px;position:sticky;top:0;background:var(--bg);z-index:2;gap:8px}
  .sheet-head h3{font-size:17px;font-weight:600;text-align:center;flex:1}
  .sheet-head .side{min-width:64px}
  .sheet-head .side.r{text-align:right}
  .stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .stat3 > div,.stat3 > button{background:var(--fill);border-radius:12px;padding:10px 10px 9px;text-align:left}
  .stat3 b{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em}
  .stat3 span{font-size:12px;color:var(--label2)}
  .bar{height:5px;border-radius:3px;background:var(--fill2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px;background:var(--tint)}
  .muted{color:var(--label2)} .tiny{font-size:12.5px} .small{font-size:14.5px}
  .hstack{display:flex;align-items:center;gap:10px} .spacer{flex:1}
  .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px}
  .actions button,.actions a{background:var(--card);border-radius:14px;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--tint)}
  .actions svg{width:22px;height:22px}
  .actions .on{color:#C2410C}
  .timeline{position:relative;padding-left:18px}
  .timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;background:var(--fill2)}
  .tl{position:relative;padding:0 0 14px}
  .tl:last-child{padding-bottom:0}
  .tl::before{content:"";position:absolute;left:-17px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:0 0 0 2px var(--label3)}
  .tl:first-child::before{box-shadow:0 0 0 2px var(--tint);background:var(--tint)}
  .check{width:20px;height:20px;color:var(--tint);flex:none}
  .toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-120px);background:rgba(30,30,32,.94);color:#fff;font-size:14.5px;font-weight:500;padding:11px 16px;border-radius:14px;z-index:60;transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:90vw;line-height:1.35}
  .toast.on{transform:translate(-50%,0)}
  .toast small{display:block;font-weight:400;opacity:.8;margin-top:2px}
  .hidden{display:none !important}
  .center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 24px calc(24px + var(--safe-b))}
  .logo{width:64px;height:64px;border-radius:16px;background:var(--tint);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
  .ring-wrap{position:relative;flex:none}
  .ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-num b{font-size:30px;font-weight:700;letter-spacing:-.02em}
  .ring-num span{font-size:12px;color:var(--label2)}
  .countdown{font-variant-numeric:tabular-nums;font-size:28px;font-weight:700;letter-spacing:-.01em}
  .num{font-variant-numeric:tabular-nums}
  .err{font-size:14px;color:var(--red);margin:10px 4px 0}
  .switch{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;flex:none;transition:background .2s}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.18);transition:transform .2s}
  .switch.on{background:var(--green)} .switch.on::after{transform:translateX(20px)}
  .empty{padding:28px 16px;text-align:center;color:var(--label2);font-size:15px}
  .note-box{background:var(--fill);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.4;white-space:pre-wrap}
  .loading{padding:36px 0;text-align:center;color:var(--label2);font-size:15px}
</style>
</head>
<body>
<div class="app">
  <!-- LOGIN -->
  <div id="vLogin" class="center hidden">
    <div class="logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9M10 20v-5h4v5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div style="font-size:30px;font-weight:700;letter-spacing:-.02em" id="loginApp">Lead Tracker</div>
    <div class="muted" style="margin-top:4px" id="loginCompany"></div>
    <form id="loginForm" style="margin-top:32px" autocomplete="on">
      <label class="field"><span>ID</span><input id="loginId" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label class="field"><span>Password</span><input id="loginPw" type="password" autocomplete="current-password" required></label>
      <p class="err hidden" id="loginErr"></p>
      <button class="btn btn-primary" style="margin-top:22px" id="loginBtn">Masuk</button>
    </form>
    <p class="foot" style="text-align:center;margin-top:18px">Tampilan baru · <a href="/" style="color:var(--tint)">Buka tampilan lama</a></p>
  </div>

  <!-- LOADING -->
  <div id="vBoot" class="center"><div class="loading">Memuat…</div></div>

  <!-- APP -->
  <div id="vApp" class="hidden">
    <div class="top">
      <div class="top-row">
        <span class="top-mini" id="topDate"></span>
        <div class="hstack" style="gap:8px">
          <button class="icon-btn" onclick="openSheet('notif')" aria-label="Notifikasi"><svg viewBox="0 0 24 24" fill="none"><path d="M18 16v-5a6 6 0 1 0-12 0v5l-1.5 2h15L18 16Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 20.5a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span class="dot-badge hidden" id="bellDot"></span></button>
          <button class="icon-btn" id="topAvatar" onclick="go('more')" style="font-weight:600;font-size:15px;color:var(--tint)" aria-label="Akun"></button>
        </div>
      </div>
      <div class="large-title" id="topTitle"></div>
    </div>
    <div id="screen" class="screen"></div>
  </div>
  <nav class="tabbar hidden" id="tabbar"></nav>
</div>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grabber"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging-compat.js"></script>
<script src="core.js"></script>
<script>
// =====================================================================
// Inisialisasi (sama dengan tampilan lama)
// =====================================================================
const FIREBASE_CONFIG_READY = !!(APP.firebase && APP.firebase.apiKey && APP.firebase.projectId);
firebase.initializeApp(APP.firebase);
const auth = firebase.auth();
const db = firebase.firestore();
const FieldValue = firebase.firestore.FieldValue;
let firestoreCacheOn = false;
try {
  db.enablePersistence({ synchronizeTabs: true }).then(function () { firestoreCacheOn = true; })
    .catch(function (err) { console.warn('Cache offline tidak aktif:', err && (err.code || err.message)); });
} catch (e) {}

// Variabel global yang dipakai fungsi di core.js
let currentUser = null;
let usersData = [];
let marketingLeadsData = [];
let marketingPendingLeads = [];
let allLeadsData = [];
let projectList = (APP.defaultProjects || []).slice();
let kpiData = null;            // data KPI yang sedang dilihat (dipakai export & rincian)
const kpiModalOpen = true;     // core.js memanggil renderKpi() setelah laporan selesai dimuat
function renderKpi() { rerender(); if (sheetState && !sheetIsForm()) renderSheet(); }
function renderNotifDropdown() { updateBell(); if (sheetState && sheetState.kind === 'notif') renderSheet(); }
function findLeadById(id) { return leadsPool().find(function (l) { return l.id === id; }) || null; }
function addNotification(scope, type, title, message, leadId) {
  recordNotif(type, title, message, leadId);
  toast(title, message);
}

// =====================================================================
// State tampilan
// =====================================================================
let role = '';                 // 'marketing' | 'staff' | 'cs'
let tab = 'home';
let leadSeg = 'todo';
let leadQuery = '';
let leadMk = '';
let kpiMonthSel = '';
let teamKpi = null;            // data KPI tim (staff) bulan ini — dipakai beranda
let myKpi = null;              // data KPI marketing bulan terpilih
let kpiBusy = false;
const kpiCacheV2 = {};
const kpiInflight = {};
const trendCache = {};
let marketingActivityData = {};
let adRotation = { counter: null, queue: null };
let unsubs = [];
let unsubLeads = null;
let knownPendingIds = null;
const reassignInFlight = new Set();

const COLORS = ['#2B45B8', '#30A46C', '#E8890C', '#8E4EC6', '#0E8DA8', '#C2410C', '#B4235A', '#4C6B22'];
const $ = function (id) { return document.getElementById(id); };
const fmt = kpiFmt;
const esc = escapeHtml;
function colorFor(s) { let h = 0; String(s || '').split('').forEach(function (c) { h = (h * 31 + c.charCodeAt(0)) >>> 0; }); return COLORS[h % COLORS.length]; }
function initials(n) {
  const w = String(n || '?').replace(/^(ibu|bu|bapak|pak|bpk|sdr|sdri)\.?\s+/i, '').trim().split(/\s+/);
  return ((w[0] || '?')[0] + (w[1] ? w[1][0] : '')).toUpperCase();
}
function leadsPool() { return role === 'marketing' ? marketingLeadsData.concat(marketingPendingLeads) : allLeadsData; }
function isClosed(l) { return CLOSED_STATUSES.indexOf(l.status) !== -1; }

const ICON = {
  home: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1v-8.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  leads: '<svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M15.5 5.2a3 3 0 0 1 0 5.6M17.5 14.6c1.6.6 2.7 2 3 4.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  kpi: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18" cy="12" r="1.6" fill="currentColor"/></svg>',
  wa: '<svg viewBox="0 0 24 24" fill="none"><path d="M5 19l1.1-3.3A7.5 7.5 0 1 1 9 18.5L5 19Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none"><path d="M6.6 3.8h2.6l1.4 3.6-1.8 1.2a10 10 0 0 0 4.6 4.6l1.2-1.8 3.6 1.4v2.6a2 2 0 0 1-2.2 2A14.5 14.5 0 0 1 4.6 6a2 2 0 0 1 2-2.2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none"><path d="M4.5 19.5h4l10-10a2.1 2.1 0 0 0-3-3l-10 10v3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  flame: '<svg viewBox="0 0 24 24" fill="none"><path d="M12.5 3c.4 2.4-.7 3.9-2.2 5.4C8.6 10.1 7 12 7 14.7a5 5 0 0 0 10 0c0-1.3-.4-2.3-1-3.2 1.1.7 2 1.9 2 3.9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" width="20" height="20"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  check: '<svg class="check" viewBox="0 0 24 24" fill="none"><path d="M5 12.5 10 17l9-10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  search: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="2"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>',
  chev: '<svg class="chev" viewBox="0 0 8 13" fill="none"><path d="M1.5 1.5 6.5 6.5l-5 5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>'
};
const chev = ICON.chev;

// =====================================================================
// Toast & sheet
// =====================================================================
let toastT;
function toast(title, sub) {
  const el = $('toast');
  el.innerHTML = esc(title) + (sub ? '<small>' + esc(sub) + '</small>' : '');

// Lead belum diterima yang lewat batas: dialihkan otomatis (sama dengan panel lama; cron juga melakukannya).
function reassignPendingLead(leadId, force) {
  if (!currentUser || role !== 'staff' || reassignInFlight.has(leadId)) return Promise.resolve();
  if (force && !confirm('Alihkan lead ini ke marketing berikutnya sekarang?')) return Promise.resolve();
  reassignInFlight.add(leadId);
  const ref = db.collection('leads').doc(leadId);
  const rotRef = db.collection('settings').doc('adRotation');
  const pool = (function () {
    const mk = activeMarketingUsers();
    const rot = mk.filter(function (u) { return u.inRotation !== false; }).map(function (u) { return u.name; });
    return rot.length ? rot : mk.map(function (u) { return u.name; });
  })();
  let result = null;
  return db.runTransaction(function (tx) {
    result = null;
    return Promise.all([tx.get(ref), tx.get(rotRef)]).then(function (snaps) {
      const s = snaps[0];
      if (!s.exists) return;
      const d = s.data();
      if (d.pendingAccept !== true) return;
      if (!force && (d.acceptExhausted || acceptDeadlineMs(d) > Date.now())) return;
      const rot = snaps[1].exists ? snaps[1].data() : {};
      const queue = normalizeRotationQueue(rot.queue, pool, Number(rot.counter) || 0);
      const next = nextAcceptCandidate(d, queue);
      if (next === null) return;
      if (!next) { if (!d.acceptExhausted) tx.update(ref, { acceptExhausted: true }); result = { exhausted: true, d: d }; return; }
      tx.set(rotRef, { queue: applyReassignToQueue(queue, d.assignedTo, next), updatedAt: FieldValue.serverTimestamp() }, { merge: true });
      tx.update(ref, {
        assignedTo: next, passedFrom: FieldValue.arrayUnion(d.assignedTo),
        acceptDeadline: firebase.firestore.Timestamp.fromMillis(Date.now() + ACCEPT_WINDOW_MS),
        acceptExhausted: false, reassignCount: FieldValue.increment(1), lastReassignAt: FieldValue.serverTimestamp()
      });
      result = { from: d.assignedTo, to: next, d: d };
    });
  }).then(function () {
    if (result && result.to) {
      callNotify('lead-reassigned', leadId);
      addNotification('csAdmin', 'followup', 'Lead dialihkan ke ' + result.to, (result.d.buyerName || 'Lead') + ': ' + result.from + ' tidak menerima.', leadId);
    } else if (result && result.exhausted && force) alert('Tidak ada marketing lain di rotasi yang belum dilewati lead ini.');
  }).catch(function (err) { console.error('Gagal mengalihkan lead:', err); if (force) alert('Gagal mengalihkan lead: ' + err.message); })
    .finally(function () { reassignInFlight.delete(leadId); });
}

  if (!force && kpiInflight[key]) return kpiInflight[key];
  const range = kpiMonthRange(month);
  const people = isMk ? [{ uid: currentUser.uid, name: currentUser.name }] : activeMarketingUsers().map(function (u) { return { uid: u.uid, name: u.name }; });
  const cfgP = db.collection('settings').doc('kpi').get().then(function (s) { kpiConfig = s.exists ? s.data() : null; }).catch(function () {});
  const snapsP = (isMk
    ? db.collection('kpiDaily').doc(kpiSnapDocId(month, currentUser.uid)).get().then(function (s) { return s.exists ? [s.data()] : []; })
    : db.collection('kpiDaily').where('ym', '==', month).get().then(function (s) { return s.docs.map(function (d) { return d.data(); }); })
  ).catch(function () { return []; });
  const p = Promise.all([cfgP, snapsP]).then(function (res) {
    const snaps = {};
    res[1].forEach(function (s) { if (s && s.uid) snaps[s.uid] = s; });
    const asOfs = people.map(function (x) { return snaps[x.uid] ? snaps[x.uid].asOf : ''; });
    const target = kpiSnapTargetAsOf(month);

      (isMk || !kpiCanVerify() || !target || asOfs[0] >= target);

  }).then(function (data) { kpiCacheV2[key] = data; return data; })
    .finally(function () { delete kpiInflight[key]; });
  kpiInflight[key] = p;
  return p;
}

    '<circle cx="' + size / 2 + '" cy="' + size / 2 + '" r="' + r + '" fill="none" stroke="' + color + '" stroke-width="' + stroke + '" stroke-linecap="round" stroke-dasharray="' + (c * v) + ' ' + c + '"/></svg>';

// ITJ & SPPR dari buyer (lead) yang sama ditampilkan sebagai SATU closing. Perhitungan KPI tetap
// per tahap (Closing ITJ 15%, Closing SPPR 35%); ini hanya tampilan.
function groupClosings(closings) {
  const by = {}, out = [];
  (closings || []).forEach(function (c) {
    let g = by[c.lead.id];
    if (!g) { g = by[c.lead.id] = { lead: c.lead, itj: null, sppr: null, date: c.date }; out.push(g); }
    g[c.key] = c;
    if (c.date > g.date) g.date = c.date;
  });
  out.forEach(function (g) {
    // Tahap yang perlu diputuskan SPV: SPPR kalau ada & menunggu, selain itu ITJ yang menunggu.
    g.pendingKey = g.sppr && g.sppr.status === 'pending' ? 'sppr' : g.itj && g.itj.status === 'pending' ? 'itj' : '';
    g.mainKey = g.sppr ? 'sppr' : 'itj';
  });
  return out.sort(function (a, b) { return b.date - a.date; });
}
function countPendingClosings(rows) {
  return rows.reduce(function (s, r) { return s + groupClosings(r.closings).filter(function (g) { return g.pendingKey; }).length; }, 0);
}
function stageChip(c, label) {
  if (!c) return '';
  const cls = c.status === 'approved' ? 'p-green' : c.status === 'rejected' ? 'p-red' : 'p-orange';

  return '<span class="pill ' + cls + '">' + label + ' ' + txt + '</span>';

}
function closingActions(g, tall) {

}

function trendCardHtml(uid, liveScore) {
  const c = trendCache[uid];
  if (!c || c.loading) { loadTrend(uid); return '<div class="card loading" style="padding:18px">Memuat tren…</div>'; }
  const cur = kpiCurrentMonth();
  const pts = kpiTrendMonthList().map(function (ym) {
    if (ym === cur) return { ym: ym, v: liveScore, live: true };
    const m = c.months[ym]; return { ym: ym, v: m && Number.isFinite(Number(m.total)) ? Number(m.total) : null, live: false };
  });
  const finals = pts.filter(function (p) { return p.v != null && !p.live; });
  const W = 320, H = 150, L = 18, R = 300, T = 22, B = 118, step = (R - L) / (pts.length - 1);
  const x = function (i) { return L + i * step; }, y = function (v) { return B - Math.max(0, Math.min(100, v)) / 100 * (B - T); };
  let g = '';
  [0, 50, 100].forEach(function (v) { g += '<line x1="' + L + '" x2="' + R + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--fill2)" stroke-width="1"/>'; });
  for (let i = 1; i < pts.length; i++) if (pts[i - 1].v != null && pts[i].v != null)
    g += '<line x1="' + x(i - 1) + '" y1="' + y(pts[i - 1].v) + '" x2="' + x(i) + '" y2="' + y(pts[i].v) + '" stroke="var(--tint)" stroke-width="2.2" stroke-linecap="round"' + (pts[i].live ? ' stroke-dasharray="4 4"' : '') + '/>';
  let lastFinal = -1; pts.forEach(function (p, i) { if (p.v != null && !p.live) lastFinal = i; });
  pts.forEach(function (p, i) {
    g += '<text x="' + x(i) + '" y="' + (H - 10) + '" font-size="11" text-anchor="middle" fill="' + (p.live ? 'var(--label)' : 'var(--label2)') + '" font-weight="' + (p.live ? 600 : 400) + '">' + kpiMonthShort(p.ym) + '</text>';
    if (p.v == null) return;
    g += '<circle cx="' + x(i) + '" cy="' + y(p.v) + '" r="4.5" fill="' + (p.live ? '#fff' : 'var(--tint)') + '" stroke="' + (p.live ? 'var(--tint)' : '#fff') + '" stroke-width="2"/>';
    if (i === lastFinal || p.live) g += '<text x="' + (i === pts.length - 1 ? x(i) + 4 : x(i)) + '" y="' + (y(p.v) - 10) + '" font-size="11.5" text-anchor="' + (i === pts.length - 1 ? 'end' : 'middle') + '" font-weight="600" fill="var(--label)">' + fmt(p.v) + '</text>';
  });
  let sum;
  if (finals.length >= 2) { const a = finals[finals.length - 2], b = finals[finals.length - 1], dd = b.v - a.v; sum = kpiMonthLabel(b.ym) + ' ' + fmt(b.v) + ' · ' + (Math.abs(dd) < 0.05 ? 'sama dengan ' : (dd > 0 ? 'naik ' : 'turun ') + fmt(Math.abs(dd)) + ' dari ') + KPI_MONTH_NAMES[Number(a.ym.slice(5)) - 1]; }
  else if (finals.length === 1) sum = kpiMonthLabel(finals[0].ym) + ' ' + fmt(finals[0].v) + ' (baru 1 bulan direkap)';
  else sum = 'Grafik terisi otomatis setelah rekap bulan lalu disimpan (tanggal 3).';
  return '<div class="card"><div class="muted tiny">' + esc(sum) + '</div><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="margin-top:8px;display:block" role="img" aria-label="Tren skor KPI 6 bulan">' + g + '</svg>' +
    '<div class="muted tiny">Titik berongga = bulan berjalan (belum final).</div></div>';
}

function formatNominalInputV2(el) {

  src.rows.forEach(function (r) { groupClosings(r.closings).forEach(function (g) { if (g.pendingKey) pend.push({ g: g, r: r }); }); });
  return sheetHead('Verifikasi Closing') + (pend.length ? pend.map(function (x) {
    return '<div class="card" style="margin-bottom:10px"><div class="hstack" style="gap:6px;flex-wrap:wrap">' + stageChip(x.g.itj, 'ITJ') + stageChip(x.g.sppr, 'SPPR') + '<span class="spacer"></span><span class="tiny muted">' + esc(x.r.name) + '</span></div>' +
      '<div style="font-size:17px;font-weight:600;margin-top:10px">' + esc(x.g.lead.buyerName || '-') + '</div><div class="muted tiny" style="margin-top:3px">' + closingInfoLine(x.g) + '</div>' +
      closingActions(x.g, true) + '</div>';
  }).join('') : '<div class="card empty">Tidak ada closing yang menunggu verifikasi.</div>') +
    '<p class="foot">Satu kartu per buyer. Menyetujui SPPR otomatis ikut menyetujui ITJ buyer yang sama. Closing baru dihitung di KPI setelah disetujui.</p>';
};

  }).join('') + '</div>' : '<div class="card empty">Tidak ada kunjungan hari ini.</div>');

  const f = sheetState.form;
  if (!f.init) { f.init = true; f.rekap = true; f.closing = true; f.laporan = true; f.who = ''; }

    '</div>' +
    '<label class="field" style="margin-top:10px"><span>Marketing</span><select onchange="sheetState.form.who=this.value"><option value="">Semua marketing</option>' +
      kpiData.rows.map(function (r) { return '<option' + (r.name === f.who ? ' selected' : '') + '>' + esc(r.name) + '</option>'; }).join('') + '</select></label>' +
    '<button class="btn btn-primary" style="margin-top:14px" id="pdfBtn" onclick="exportPdfV2()">Unduh PDF</button>' +
    '<div class="section-h"><h2 style="font-size:17px">Excel</h2></div>' +

    '<p class="foot">Excel berisi rekap, laporan online/offline, dan closing.</p>';

function acceptLead(leadId, btn) {
  if (role !== 'marketing') return;
  if (btn) { btn.disabled = true; btn.textContent = 'Memproses…'; }
  const ref = db.collection('leads').doc(leadId);
  let accepted = null;
  db.runTransaction(function (tx) {
    return tx.get(ref).then(function (snap) {
      if (!snap.exists) throw new Error('LEAD_MOVED');
      const d = snap.data();
      if (d.assignedTo !== currentUser.name) throw new Error('LEAD_MOVED');
      accepted = Object.assign({ id: leadId }, d, { pendingAccept: false });
      if (d.pendingAccept !== true) return;
      tx.update(ref, { pendingAccept: false, acceptedAt: FieldValue.serverTimestamp(), acceptedBy: currentUser.name, acceptedLate: Date.now() > acceptDeadlineMs(d) });
    });
  }).then(function () {
    logMarketingActivity('Terima lead', accepted.buyerName, leadId, '');
    callNotify('lead-accepted', leadId);
    openSheet('accepted', accepted);
  }).catch(function (err) {
    if (err && err.message === 'LEAD_MOVED') alert('Lead ini sudah dialihkan ke marketing lain karena melewati batas waktu 5 menit.');
    else alert('Gagal menerima lead: ' + (err && err.message));
    if (btn && document.body.contains(btn)) { btn.disabled = false; btn.textContent = 'Terima Lead'; }
  });
}
function contactLeadWa(id) {
  const lead = (sheetState && sheetState.arg && sheetState.arg.id === id) ? sheetState.arg : findLeadById(id);
  if (!lead) return;
  const project = lead.project || 'kami', buyer = lead.buyerName || 'Bapak/Ibu', mk = currentUser.name, smile = '☺️';
  const msg = 'Halo!' + smile + '\nDengan ' + buyer + ', perkenalkan saya ' + mk + ' marketing executive ' + project + '.\n' +
    'Terima kasih banyak atas ketertarikannya terhadap perumahan kami.\nKalau boleh tau Bapak/Ibu lagi cari hunian atau investasi?\n' +
    'Kalau ada yang ingin ditanyakan terkait unit, kavling atau spesifikasi pembayaran\nDengan senang hati ' + mk + ' siap membantu ' + buyer + ' ' + smile;
  window.open('https://api.whatsapp.com/send?phone=' + toWaDigits(lead.waNumber) + '&text=' + encodeURIComponent(msg), '_blank');
}

function toggleHot(id) {
  const l = findLeadById(id); if (!l) return;

    .then(function () { logMarketingActivity(!l.isHot ? 'Tandai Hot Prospek' : 'Cabut Hot Prospek', l.buyerName, id); toast(!l.isHot ? 'Ditandai Hot Prospek' : 'Tanda Hot dicabut'); })

}

function savePrivateNote(id) {
  const text = $('privNote').value.trim(), hidden = !!sheetState.form.noteHidden;
  db.collection('leads').doc(id).update({ privateNote: text, privateNoteHidden: hidden })
    .then(function () { const l = findLeadById(id); if (l) { l.privateNote = text; l.privateNoteHidden = hidden; } sheetState.form.noteEditing = false; renderSheet(); toast('Catatan tersimpan'); })
    .catch(function (err) { alert('Gagal menyimpan catatan: ' + err.message); });
}

function deleteLead(id) {
  const l = findLeadById(id); if (!l) return;
  if (!confirm('Hapus lead "' + (l.buyerName || '-') + '" secara permanen?')) return;

function saveUpdateV2(id) {
  captureUpd();
  const f = sheetState.form, l = findLeadById(id);
  if (!l) return;
  const note = (f.note || '').trim();
  if (!note) { alert('Catatan update wajib diisi supaya tim tahu perkembangan di tahap ini.'); return; }
  const newStatus = f.status;
  const visitDate = f.visitDate || '', visitTime = visitDate ? (f.visitTime || '') : '';
  const visitChanged = visitDate !== (l.visitDate || '') || visitTime !== (l.visitTime || '');
  if (!visitDate && f.visitTime && visitChanged) { alert('Isi tanggal janji kunjungan dulu (jam boleh kosong).'); return; }
  if (visitChanged && visitDate && visitDate < toDateInputValue(new Date())) { alert('Tanggal janji kunjungan sudah lewat.'); return; }
  const historyEntry = { date: new Date(), status: newStatus, note: note };
  if (visitChanged) historyEntry.visit = visitDate ? formatVisit(visitDate, visitTime) : 'dibatalkan';
  const key = closingKeyForStatus(newStatus);
  let cProject = '', cUnit = '', cNominal = '';
  if (key) {
    cProject = $('updProj').value; cUnit = $('updUnit').value.trim(); cNominal = formatRupiahDigits($('updNominal').value);
    if (!cProject) { alert('Pilih proyek yang closing.'); return; }
    if (!cUnit) { alert('Isi Unit / Blok yang closing supaya SPV/Manager bisa memverifikasi.'); return; }
    historyEntry.closingProject = cProject; historyEntry.unit = cUnit; if (cNominal) historyEntry.nominal = cNominal;
  }
  const prev = key ? ((l.closingInfo || {})[key] || null) : null;
  const closingChanged = !!key && (!prev || prev.project !== cProject || prev.unit !== cUnit || formatRupiahDigits(prev.nominal) !== cNominal);
  const payload = { status: newStatus, nextFollowUpDate: fromDateInputValue(f.next), lastUpdated: FieldValue.serverTimestamp(), notes: FieldValue.arrayUnion(historyEntry) };
  if (closingChanged) payload['closingInfo.' + key] = { project: cProject, unit: cUnit, nominal: cNominal, at: new Date() };
  if (visitChanged && visitDate) { payload.visitDate = visitDate; payload.visitTime = visitTime; payload.visitSetAt = FieldValue.serverTimestamp(); payload.visitSetBy = currentUser.name; }
  else if (visitChanged) { payload.visitDate = FieldValue.delete(); payload.visitTime = FieldValue.delete(); payload.visitCancelled = formatVisit(l.visitDate, l.visitTime); payload.visitCancelledAt = FieldValue.serverTimestamp(); }
  const btn = $('updSave'); if (btn) { btn.disabled = true; btn.textContent = 'Menyimpan…'; }
  const oldStatus = l.status || '-';
  db.collection('leads').doc(id).update(payload).then(function () {
    waIndexPut(id, Object.assign({}, l, { status: newStatus, notes: (Array.isArray(l.notes) ? l.notes : []).concat([historyEntry]) }));
    logMarketingActivity('Update status ke ' + newStatus, l.buyerName, id, oldStatus + ' → ' + newStatus + ' · Catatan: ' + (note.length > 120 ? note.slice(0, 120) + '...' : note));
    if (closingChanged) callNotify('closing-submitted', id, { stage: key });
    if (visitChanged) {
      callNotify(visitDate ? 'visit-scheduled' : 'visit-cancelled', id);
      logMarketingActivity(visitDate ? 'Janji kunjungan' : 'Batalkan kunjungan', l.buyerName, id, visitDate ? formatVisit(visitDate, visitTime) : (formatVisit(l.visitDate, l.visitTime) || '-'));
    }
    closeSheet(); toast('Status tersimpan', l.buyerName + ' → ' + newStatus); afterKpiChange();
  }).catch(function (err) { alert('Gagal memperbarui status: ' + err.message); if (btn) { btn.disabled = false; btn.textContent = 'Simpan'; } });
}

function saveNewLead() {
  const err = function (m) { $('nlErr').textContent = m; $('nlErr').classList.remove('hidden'); };
  $('nlErr').classList.add('hidden');
  const buyerName = $('nlName').value.trim(), waNumber = $('nlWa').value.trim(), project = $('nlProject').value;
  const src = $('nlSource').value, adSource = src === 'Lainnya' ? $('nlOther').value.trim() : src, note = $('nlNote').value.trim();
  if (!buyerName || !waNumber || !project || !adSource) return err('Lengkapi nama, nomor WhatsApp, proyek, dan sumber.');
  const waErr = validateWaNumber(waNumber); if (waErr) return err(waErr);
  const btn = $('nlSave'); btn.disabled = true; btn.textContent = 'Memeriksa…';
  checkDuplicateAcrossTeam(waNumber).then(function (matches) {
    if (matches.length && !confirm(buildDuplicateWarning(matches))) return null;
    btn.textContent = 'Menyimpan…';
    return db.collection('leads').add({
      buyerName: buyerName, waNumber: waNumber, waDigits: toWaDigits(waNumber), adSource: adSource, project: project,
      assignedTo: currentUser.name, csNote: note, isAdLead: false, isSelfInput: true, status: 'New', isHot: false,
      nextFollowUpDate: defaultNextFollowUp(), createdAt: FieldValue.serverTimestamp(), lastUpdated: FieldValue.serverTimestamp()
    });
  }).then(function (ref) {
    if (!ref) return;
    waIndexPut(ref.id, { waNumber: waNumber, assignedTo: currentUser.name, status: 'New', project: project, createdAt: new Date() });
    logMarketingActivity('Input lead mandiri', buyerName, ref.id, project);
    closeSheet(); toast('Lead tersimpan', buyerName); afterKpiChange();
  }).catch(function (e) { err('Gagal menyimpan lead: ' + e.message); })
    .finally(function () { if (document.body.contains(btn)) { btn.disabled = false; btn.textContent = 'Simpan'; } });
}

function saveReportV2() {
  captureRep();
  const f = sheetState.form, err = function (m) { $('repErr').textContent = m; $('repErr').classList.remove('hidden'); };
  const dateKey = f.date || toDateInputValue(new Date()), today = toDateInputValue(new Date());
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dateKey)) return err('Pilih tanggal kegiatan.');
  if (dateKey > today) return err('Tanggal tidak boleh lebih dari hari ini.');
  if (dateKey.slice(0, 7) !== kpiCurrentMonth()) return err('Laporan hanya bisa untuk tanggal di bulan ini.');
  const doc = { dateKey: dateKey, type: f.type, note: String(f.note || '').trim().slice(0, 300), name: currentUser.name || '', createdAt: FieldValue.serverTimestamp() };
  if (f.type === 'Live TikTok') {
    let link = String(f.link || '').trim();
    if (!link) return err('Link video Live TikTok wajib diisi.');
    if (!/^https?:\/\//i.test(link)) link = 'https://' + link;
    if (!/tiktok\.com/i.test(link)) return err('Link harus dari TikTok (tiktok.com).');
    doc.link = link.slice(0, 500);
  } else {
    doc.place = String(f.place || '').trim().slice(0, 150); doc.permitFrom = String(f.permit || '').trim().slice(0, 150);
    doc.reportGroup = String(f.group || '').trim().slice(0, 100); doc.reportTime = f.time || '';
    if (!doc.place) return err('Isi lokasi canvasing.');
    if (!doc.permitFrom) return err('Isi izin canvasing didapat dari siapa.');
    if (!doc.reportGroup || !doc.reportTime) return err('Isi nama grup dan jam kamu melapor di grup.');
  }
  const btn = $('repSave'); btn.disabled = true; btn.textContent = 'Mengirim…';
  kpiReportsRef(currentUser.uid).add(doc).then(function () {
    delete kpiReportsCache[kpiCurrentMonth() + '|' + currentUser.uid];
    closeSheet(); toast('Laporan terkirim'); afterKpiChange();
  }).catch(function (e) { err('Gagal menyimpan laporan: ' + e.message); btn.disabled = false; btn.textContent = 'Kirim'; });
}

function deleteReport(uid, id) {
  if (!confirm('Hapus laporan ini?')) return;
  kpiReportsRef(uid).doc(id).delete().then(function () {
    delete kpiReportsCache[(kpiData ? kpiData.month : kpiCurrentMonth()) + '|' + uid]; toast('Laporan dihapus'); afterKpiChange();
  }).catch(function (e) { alert('Gagal menghapus laporan: ' + e.message); });
}

function toggleInvalid(uid, id, makeInvalid) {
  let payload;
  if (makeInvalid) {
    const reason = prompt('Alasan laporan ini tidak valid (terlihat oleh marketing):', '');
    if (reason === null) return;
    payload = { invalid: true, invalidReason: reason.trim().slice(0, 200), invalidBy: currentUser.name || '', invalidAt: FieldValue.serverTimestamp() };
  } else payload = { invalid: false, invalidReason: '', invalidBy: currentUser.name || '', invalidAt: FieldValue.serverTimestamp() };
  kpiReportsRef(uid).doc(id).update(payload).then(function () {
    if (makeInvalid) callNotify('report-invalid', '', { uid: uid, reportId: id });
    delete kpiReportsCache[kpiData.month + '|' + uid]; toast(makeInvalid ? 'Ditandai tidak valid' : 'Tanda tidak valid dibatalkan'); afterKpiChange();
  }).catch(function (e) { alert('Gagal: ' + e.message); });
}

function verifyClosing(leadId, key, status) {
  const src = kpiData || teamKpi;
  const lead = src && src.leadsById[leadId];
  if (!lead || !kpiCanVerify()) return;
  if (status === 'rejected' && !confirm('Tolak ' + kpiStageLabel(key) + ' untuk ' + (lead.buyerName || 'lead ini') + '? Closing ini tidak dihitung di KPI.')) return;
  const mark = { status: status, by: currentUser.name || '', byUid: currentUser.uid, at: FieldValue.serverTimestamp() };
  const upd = {}; upd['kpiVerify.' + key] = mark;
  if (key === 'sppr' && status === 'approved' && kpiVerifyStatus(lead, 'itj') === 'pending') upd['kpiVerify.itj'] = mark;
  db.collection('leads').doc(leadId).update(upd).then(function () {
    callNotify('closing-verified', leadId, { stage: key });
    toast(status === 'approved' ? 'Closing disetujui' : 'Closing ditolak', lead.buyerName); afterKpiChange();
  }).catch(function (e) { alert('Gagal menyimpan verifikasi: ' + e.message); });
}

function saveTrendSnapshot() {
  if (!kpiData || !kpiCanVerify() || kpiData.month >= kpiCurrentMonth()) return;
  if (!confirm('Simpan skor KPI ' + kpiMonthLabel(kpiData.month) + ' untuk ' + kpiData.rows.length + ' marketing ke grafik tren?')) return;
  const items = kpiItems(), batch = db.batch();
  kpiData.rows.forEach(function (r) {
    const sc = kpiScore(r.counts, items), parts = {}; sc.parts.forEach(function (p) { parts[p.item.key] = p.actual; });
    const months = {}; months[kpiData.month] = { total: Math.round(sc.total * 100) / 100, parts: parts, lockedAt: FieldValue.serverTimestamp(), lockedBy: currentUser.name || '' };
    batch.set(kpiHistoryRef(r.uid), { name: r.name, months: months, updatedAt: FieldValue.serverTimestamp() }, { merge: true });
  });
  batch.commit().then(function () { Object.keys(trendCache).forEach(function (k) { delete trendCache[k]; }); toast('Tersimpan ke grafik tren'); })
    .catch(function (e) { alert('Gagal menyimpan: ' + e.message); });
}

function loadScript(src) {
  return new Promise(function (res, rej) { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = function () { rej(new Error('Gagal memuat ' + src)); }; document.head.appendChild(s); });
}
function exportPdfV2() {
  const f = sheetState.form;
  if (!f.rekap && !f.closing && !f.laporan) { alert('Pilih minimal satu bagian.'); return; }
  const btn = $('pdfBtn'); btn.disabled = true; btn.textContent = 'Menyiapkan…';
  const libs = window.jspdf ? Promise.resolve() : loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js')
    .then(function () { return loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js'); });
  Promise.all([libs, f.laporan ? kpiEnsureAllReports() : Promise.resolve()])
    .then(function () { kpiBuildPdf({ rekap: f.rekap, closing: f.closing, laporan: f.laporan }, f.who || ''); })
    .catch(function (e) { alert(e.message); })
    .finally(function () { if (document.body.contains(btn)) { btn.disabled = false; btn.textContent = 'Unduh PDF'; } });
}
function exportExcelV2() { kpiEnsureAllReports().then(exportKpiExcelNow); }

// =====================================================================
// Push notification
// =====================================================================
function registerPushToken() {
  if (!currentUser || pushUnsupportedReason() || Notification.permission !== 'granted') return Promise.resolve(null);
  return getPushSwRegistration().then(function (reg) {
    if (!pushMessaging) pushMessaging = firebase.messaging();
    if (!pushOnMessageBound) {
      pushOnMessageBound = true;
      pushMessaging.onMessage(function (payload) {
        const kind = (payload.data && payload.data.kind) || '';
        if (kind === 'lead-pending' || kind === 'lead-warn') return;
        const n = payload.notification || payload.data || {};
        toast(n.title || 'Notifikasi', n.body || '');
        recordNotif(kind === 'broadcast' || kind.indexOf('lead') === 0 ? 'new' : 'followup', n.title || 'Notifikasi', n.body || '', (payload.data && payload.data.leadId) || null);
      });
    }
    return pushMessaging.getToken({ vapidKey: APP.firebase.vapidKey, serviceWorkerRegistration: reg });
  }).then(function (token) {
    if (!token || !currentUser) return null;
    try { localStorage.setItem(PUSH_TOKEN_STORE_KEY, token); } catch (e) {}
    return db.collection('pushTokens').doc(currentUser.uid).set({ uid: currentUser.uid, name: currentUser.name, role: currentUser.role, tokens: FieldValue.arrayUnion(token), updatedAt: FieldValue.serverTimestamp() }, { merge: true })
      .then(function () { return token; });
  }).catch(function (err) { console.error('Gagal mendaftarkan push:', err); return null; })
    .finally(rerender);
}
function enablePush() {
  const reason = pushUnsupportedReason();
  if (reason) { alert(reason); return; }
  Notification.requestPermission().then(function (perm) {
    if (perm !== 'granted') { alert('Izin notifikasi ditolak. Izinkan Notifikasi di pengaturan situs browser.'); rerender(); return; }
    registerPushToken().then(function (t) { toast(t ? 'Notifikasi aktif' : 'Gagal mengaktifkan notifikasi'); });
  });
}
function initPush() { if ('Notification' in window && Notification.permission === 'granted') registerPushToken(); }
