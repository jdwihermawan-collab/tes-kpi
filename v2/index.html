<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F2F7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Lead Tracker">
<title>Lead Tracker</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<!--
  TAMPILAN BARU (/v2/) — data asli Firebase yang sama dengan tampilan lama (/).
  Logika (KPI, terima lead, cek nomor ganda, rekap hemat-read, lonceng) ada di core.js yang
  DISALIN OTOMATIS dari /index.html oleh scripts/build-v2-core.py. File ini hanya tampilan & alur.
-->
<style>
  :root{
    --bg:#F2F2F7; --card:#FFFFFF; --fill:#EEEEF3; --fill2:#E5E5EA;
    --label:#1C1C1E; --label2:#6C6C70; --label3:#AEAEB2; --sep:rgba(60,60,67,.13);
    --tint:#2B45B8; --tint-soft:#E9EDFB;
    --green:#30A46C; --green-soft:#E6F6EE; --orange:#E8890C; --orange-soft:#FDF1E1; --red:#E5484D; --red-soft:#FDECEC;
    --r-card:18px; --r-row:14px; --r-btn:14px; --safe-b:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--label);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;font-size:17px;line-height:1.3;-webkit-font-smoothing:antialiased}
  body{min-height:100vh}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  button:disabled{opacity:.5}
  input,select,textarea{font:inherit;color:inherit}
  a{color:inherit;text-decoration:none}
  .app{max-width:440px;margin:0 auto;min-height:100vh;position:relative;background:var(--bg);overflow-x:hidden}
  .top{position:sticky;top:0;z-index:20;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 6px;background:rgba(242,242,247,.86);backdrop-filter:saturate(180%) blur(18px);-webkit-backdrop-filter:saturate(180%) blur(18px)}
  .top-row{display:flex;align-items:center;justify-content:space-between;min-height:36px}
  .top-mini{font-size:13px;color:var(--label2);font-weight:500}
  .icon-btn{width:36px;height:36px;border-radius:50%;background:var(--card);display:inline-flex;align-items:center;justify-content:center;position:relative;flex:none}
  .icon-btn svg{width:19px;height:19px}
  .dot-badge{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--red);box-shadow:0 0 0 2px var(--card)}
  .large-title{font-size:32px;font-weight:700;letter-spacing:-.02em;padding:4px 0 2px}
  .screen{padding:4px 16px calc(96px + var(--safe-b))}
  .section-h{display:flex;justify-content:space-between;align-items:baseline;margin:22px 4px 8px;gap:8px}
  .section-h h2{font-size:20px;font-weight:700;letter-spacing:-.01em}
  .section-h .link{font-size:15px;color:var(--tint);font-weight:500;white-space:nowrap}
  .foot{font-size:13px;color:var(--label2);margin:6px 16px 0;line-height:1.35}
  .card{background:var(--card);border-radius:var(--r-card);padding:16px}
  .group{background:var(--card);border-radius:var(--r-card);overflow:hidden}
  .row{display:flex;align-items:center;gap:12px;padding:12px 16px;min-height:52px;position:relative;width:100%;text-align:left}
  .row + .row::before{content:"";position:absolute;top:0;left:16px;right:0;height:.5px;background:var(--sep)}
  .row.ind + .row.ind::before{left:66px}
  button.row:active{background:var(--fill)}
  .row .main{flex:1;min-width:0}
  .row .t{font-size:16px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .s{font-size:13.5px;color:var(--label2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row .v{font-size:14px;color:var(--label2);white-space:nowrap}
  .wrap{white-space:normal !important}
  .chev{width:8px;height:13px;flex:none;color:var(--label3)}
  .avatar{width:38px;height:38px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;color:#fff}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
  .p-blue{background:var(--tint-soft);color:var(--tint)} .p-green{background:var(--green-soft);color:#1F7A4D}
  .p-orange{background:var(--orange-soft);color:#A55E00} .p-red{background:var(--red-soft);color:#C02B30} .p-gray{background:var(--fill);color:var(--label2)}
  .p-purple{background:#F1EAFB;color:#6B3FA0}
  .btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:var(--r-btn);font-weight:600;font-size:16.5px;width:100%}
  .btn-primary{background:var(--tint);color:#fff}
  .btn-primary:active{opacity:.85}
  .btn-tinted{background:var(--tint-soft);color:var(--tint)}
  .btn-danger{background:var(--red-soft);color:var(--red)}
  .btn-green{background:var(--green);color:#fff}
  .btn-plain{color:var(--tint);font-weight:500;font-size:16px;padding:6px 0}
  .field{background:var(--card);border-radius:var(--r-row);padding:0 16px;display:block}
  .field > span{display:block;font-size:12.5px;color:var(--label2);padding-top:9px}
  .field > .pw-row{display:flex;align-items:center;gap:6px;padding-top:0;font-size:inherit;color:inherit}
  .pw-row input{flex:1;min-width:0}
  .pw-eye{flex:none;width:36px;height:32px;margin:-4px -8px 4px 0;border:0;background:transparent;color:var(--label2);display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:8px;-webkit-tap-highlight-color:transparent}
  .pw-eye:focus-visible{outline:2px solid var(--tint)}
  .field input,.field select,.field textarea{width:100%;border:0;outline:0;background:transparent;font-size:16.5px;padding:2px 0 10px;-webkit-appearance:none;appearance:none}
  .field textarea{resize:none;min-height:70px}
  .field + .field,.field + .grid2,.grid2 + .field{margin-top:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid2 .field{margin:0}
  .search{display:flex;align-items:center;gap:8px;background:var(--fill2);border-radius:12px;height:38px;padding:0 10px;color:var(--label2);flex:1}
  .search input{flex:1;border:0;outline:0;background:transparent;font-size:16px;min-width:0}
  .seg{display:flex;background:var(--fill2);border-radius:10px;padding:2px;margin-top:10px}
  .seg button{flex:1;height:30px;border-radius:8px;font-size:13.5px;font-weight:500}
  .seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04);font-weight:600}
  .select-chip{background:var(--fill2);border-radius:10px;border:0;height:34px;padding:0 10px;font-size:14px;font-weight:500;outline:0;max-width:100%}
  .tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:440px;z-index:30;display:flex;justify-content:space-around;
    padding:6px 8px calc(6px + var(--safe-b));background:rgba(249,249,251,.9);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep)}
  .tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:500;color:var(--label3);padding:4px 0;position:relative}
  .tab svg{width:25px;height:25px}
  .tab.on{color:var(--tint)}
  .tab .badge{position:absolute;top:0;left:calc(50% + 6px);min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 4px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
  .scrim.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:50%;bottom:0;width:100%;max-width:440px;z-index:41;background:var(--bg);border-radius:22px 22px 0 0;max-height:93vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
    transform:translate(-50%,105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding:0 16px calc(28px + var(--safe-b))}
  .sheet.on{transform:translate(-50%,0)}
  .grabber{width:38px;height:5px;border-radius:3px;background:var(--label3);opacity:.55;margin:8px auto 4px}
  .sheet-head{display:flex;align-items:center;justify-content:space-between;padding:4px 0 12px;position:sticky;top:0;background:var(--bg);z-index:2;gap:8px}
  .sheet-head h3{font-size:17px;font-weight:600;text-align:center;flex:1}
  .sheet-head .side{min-width:64px}
  .sheet-head .side.r{text-align:right}
  .stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
  .stat3 > div,.stat3 > button{background:var(--fill);border-radius:12px;padding:10px 10px 9px;text-align:left}
  .stat3 b{display:block;font-size:19px;font-weight:700;letter-spacing:-.01em}
  .stat3 span{font-size:12px;color:var(--label2)}
  .bar{height:5px;border-radius:3px;background:var(--fill2);overflow:hidden}
  .bar i{display:block;height:100%;border-radius:3px;background:var(--tint)}
  .muted{color:var(--label2)} .tiny{font-size:12.5px} .small{font-size:14.5px}
  .hstack{display:flex;align-items:center;gap:10px} .spacer{flex:1}
  .actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0 4px}
  .actions button,.actions a{background:var(--card);border-radius:14px;padding:10px 0 9px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--tint)}
  .actions svg{width:22px;height:22px}
  .actions .on{color:#C2410C}
  .timeline{position:relative;padding-left:18px}
  .timeline::before{content:"";position:absolute;left:5px;top:6px;bottom:6px;width:1.5px;background:var(--fill2)}
  .tl{position:relative;padding:0 0 14px}
  .tl:last-child{padding-bottom:0}
  .tl::before{content:"";position:absolute;left:-17px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--card);box-shadow:0 0 0 2px var(--label3)}
  .tl:first-child::before{box-shadow:0 0 0 2px var(--tint);background:var(--tint)}
  .check{width:20px;height:20px;color:var(--tint);flex:none}
  .toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translate(-50%,-120px);background:rgba(30,30,32,.94);color:#fff;font-size:14.5px;font-weight:500;padding:11px 16px;border-radius:14px;z-index:60;transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:90vw;line-height:1.35}
  .toast.on{transform:translate(-50%,0)}
  .toast small{display:block;font-weight:400;opacity:.8;margin-top:2px}
  .hidden{display:none !important}
  .center{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px 24px calc(24px + var(--safe-b))}
  .logo{width:64px;height:64px;border-radius:16px;background:var(--tint);display:flex;align-items:center;justify-content:center;margin-bottom:18px}
  .ring-wrap{position:relative;flex:none}
  .ring-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring-num b{font-size:30px;font-weight:700;letter-spacing:-.02em}
  .ring-num span{font-size:12px;color:var(--label2)}
  .countdown{font-variant-numeric:tabular-nums;font-size:28px;font-weight:700;letter-spacing:-.01em}
  .num{font-variant-numeric:tabular-nums}
  .err{font-size:14px;color:var(--red);margin:10px 4px 0}
  .switch{width:51px;height:31px;border-radius:16px;background:var(--fill2);position:relative;flex:none;transition:background .2s}
  .switch::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.18);transition:transform .2s}
  .switch.on{background:var(--green)} .switch.on::after{transform:translateX(20px)}
  .empty{padding:28px 16px;text-align:center;color:var(--label2);font-size:15px}
  .note-box{background:var(--fill);border-radius:12px;padding:10px 12px;font-size:14.5px;line-height:1.4;white-space:pre-wrap}
  .loading{padding:36px 0;text-align:center;color:var(--label2);font-size:15px}
</style>
</head>
<body>
<div class="app">
  <!-- LOGIN -->
  <div id="vLogin" class="center hidden">
    <div class="logo"><svg width="34" height="34" viewBox="0 0 24 24" fill="none"><path d="M4 11.5 12 4l8 7.5M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9M10 20v-5h4v5" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div style="font-size:30px;font-weight:700;letter-spacing:-.02em" id="loginApp">Lead Tracker</div>
    <div class="muted" style="margin-top:4px" id="loginCompany"></div>
    <form id="loginForm" style="margin-top:32px" autocomplete="on">
      <label class="field"><span>ID</span><input id="loginId" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label class="field"><span>Password</span><span class="pw-row"><input id="loginPw" type="password" autocomplete="current-password" required><button type="button" class="pw-eye" id="loginPwEye" aria-label="Tampilkan password" aria-pressed="false"></button></span></label>
      <p class="err hidden" id="loginErr"></p>
      <button class="btn btn-primary" style="margin-top:22px" id="loginBtn">Masuk</button>
    </form>
    <p class="foot" style="text-align:center;margin-top:18px">Tampilan baru · <a href="/" style="color:var(--tint)">Buka tampilan lama</a></p>
  </div>

  <!-- LOADING -->
  <div id="vBoot" class="center"><div class="loading">Memuat…</div></div>

  <!-- APP -->
  <div id="vApp" class="hidden">
    <div class="top">
      <div class="top-row">
        <span class="top-mini" id="topDate"></span>
        <div class="hstack" style="gap:8px">
          <button class="icon-btn" onclick="openSheet('notif')" aria-label="Notifikasi"><svg viewBox="0 0 24 24" fill="none"><path d="M18 16v-5a6 6 0 1 0-12 0v5l-1.5 2h15L18 16Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M10 20.5a2 2 0 0 0 4 0" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg><span class="dot-badge hidden" id="bellDot"></span></button>
          <button class="icon-btn" id="topAvatar" onclick="go('more')" style="font-weight:600;font-size:15px;color:var(--tint)" aria-label="Akun"></button>
        </div>
      </div>
      <div class="large-title" id="topTitle"></div>
    </div>
    <div id="screen" class="screen"></div>
  </div>
  <nav class="tabbar hidden" id="tabbar"></nav>
</div>

<div class="scrim" id="scrim" onclick="closeSheet()"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grabber"></div><div id="sheetBody"></div></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-messaging-compat.js"></script>
<script src="core.js"></script>
<script>
// =====================================================================
// Inisialisasi (sama dengan tampilan lama)
// =====================================================================
const FIREBASE_CONFIG_READY = !!(APP.firebase && APP.firebase.apiKey && APP.firebase.projectId);
firebase.initializeApp(APP.firebase);
const auth = firebase.auth();
const db = firebase.firestore();
const FieldValue = firebase.firestore.FieldValue;
let firestoreCacheOn = false;
try {
  db.enablePersistence({ synchronizeTabs: true }).then(function () { firestoreCacheOn = true; })
    .catch(function (err) { console.warn('Cache offline tidak aktif:', err && (err.code || err.message)); });
} catch (e) {}

// Variabel global yang dipakai fungsi di core.js
let currentUser = null;
let usersData = [];
let marketingLeadsData = [];
let marketingPendingLeads = [];
let allLeadsData = [];
let projectList = (APP.defaultProjects || []).slice();
let kpiData = null;            // data KPI yang sedang dilihat (dipakai export & rincian)
const kpiModalOpen = true;     // core.js memanggil renderKpi() setelah laporan selesai dimuat
function renderKpi() { rerender(); if (sheetState && !sheetIsForm()) renderSheet(); }
function renderNotifDropdown() { updateBell(); if (sheetState && sheetState.kind === 'notif') renderSheet(); }
function findLeadById(id) { return leadsPool().find(function (l) { return l.id === id; }) || null; }
function addNotification(scope, type, title, message, leadId) {
  recordNotif(type, title, message, leadId);
  toast(title, message);
}

// =====================================================================
// State tampilan
// =====================================================================
let role = '';                 // 'marketing' | 'staff' | 'cs'
let tab = 'home';
let leadSeg = 'todo';
let leadQuery = '';
let leadMk = '';
let kpiMonthSel = '';
let teamKpi = null;            // data KPI tim (staff) bulan ini — dipakai beranda
let myKpi = null;              // data KPI marketing bulan terpilih
let kpiBusy = false;
const kpiCacheV2 = {};
const kpiInflight = {};
const trendCache = {};
let marketingActivityData = {};
let adRotation = { counter: null, queue: null };
let unsubs = [];
let unsubLeads = null;
let knownPendingIds = null;
const reassignInFlight = new Set();

const COLORS = ['#2B45B8', '#30A46C', '#E8890C', '#8E4EC6', '#0E8DA8', '#C2410C', '#B4235A', '#4C6B22'];
const $ = function (id) { return document.getElementById(id); };
const fmt = kpiFmt;
const esc = escapeHtml;
function colorFor(s) { let h = 0; String(s || '').split('').forEach(function (c) { h = (h * 31 + c.charCodeAt(0)) >>> 0; }); return COLORS[h % COLORS.length]; }
function initials(n) {
  const w = String(n || '?').replace(/^(ibu|bu|bapak|pak|bpk|sdr|sdri)\.?\s+/i, '').trim().split(/\s+/);
  return ((w[0] || '?')[0] + (w[1] ? w[1][0] : '')).toUpperCase();
}
function leadsPool() { return role === 'marketing' ? marketingLeadsData.concat(marketingPendingLeads) : allLeadsData; }
function isTeamRole() { return role === 'staff' || role === 'cs'; }   // CS & SPV/Admin: memuat semua lead
function isClosed(l) { return CLOSED_STATUSES.indexOf(l.status) !== -1; }

const ICON = {
  home: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1v-8.5Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  leads: '<svg viewBox="0 0 24 24" fill="none"><circle cx="9" cy="8" r="3.2" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 19c.6-3 2.8-4.6 5.5-4.6s4.9 1.6 5.5 4.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><path d="M15.5 5.2a3 3 0 0 1 0 5.6M17.5 14.6c1.6.6 2.7 2 3 4.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  kpi: '<svg viewBox="0 0 24 24" fill="none"><path d="M4 20V10M10 20V4M16 20v-7M21 20H3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>',
  more: '<svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="18" cy="12" r="1.6" fill="currentColor"/></svg>',
  wa: '<svg viewBox="0 0 24 24" fill="none"><path d="M5 19l1.1-3.3A7.5 7.5 0 1 1 9 18.5L5 19Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  phone: '<svg viewBox="0 0 24 24" fill="none"><path d="M6.6 3.8h2.6l1.4 3.6-1.8 1.2a10 10 0 0 0 4.6 4.6l1.2-1.8 3.6 1.4v2.6a2 2 0 0 1-2.2 2A14.5 14.5 0 0 1 4.6 6a2 2 0 0 1 2-2.2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  edit: '<svg viewBox="0 0 24 24" fill="none"><path d="M4.5 19.5h4l10-10a2.1 2.1 0 0 0-3-3l-10 10v3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
  flame: '<svg viewBox="0 0 24 24" fill="none"><path d="M12.5 3c.4 2.4-.7 3.9-2.2 5.4C8.6 10.1 7 12 7 14.7a5 5 0 0 0 10 0c0-1.3-.4-2.3-1-3.2 1.1.7 2 1.9 2 3.9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',

// Lead belum diterima yang lewat batas: dialihkan otomatis (sama dengan panel lama; cron juga melakukannya).
function reassignPendingLead(leadId, force) {
  if (!currentUser || !isTeamRole() || reassignInFlight.has(leadId)) return Promise.resolve();
  if (force && !confirm('Alihkan lead ini ke marketing berikutnya sekarang?')) return Promise.resolve();
  reassignInFlight.add(leadId);
  const ref = db.collection('leads').doc(leadId);
  const rotRef = db.collection('settings').doc('adRotation');
  const pool = (function () {
    const mk = activeMarketingUsers();
    const rot = mk.filter(function (u) { return u.inRotation !== false; }).map(function (u) { return u.name; });
    return rot.length ? rot : mk.map(function (u) { return u.name; });
  })();
  let result = null;
  return db.runTransaction(function (tx) {
    result = null;
    return Promise.all([tx.get(ref), tx.get(rotRef)]).then(function (snaps) {
      const s = snaps[0];
      if (!s.exists) return;
      const d = s.data();
      if (d.pendingAccept !== true) return;
      if (!force && (d.acceptExhausted || acceptDeadlineMs(d) > Date.now())) return;
      const rot = snaps[1].exists ? snaps[1].data() : {};
      const queue = normalizeRotationQueue(rot.queue, pool, Number(rot.counter) || 0);
      const next = nextAcceptCandidate(d, queue);
      if (next === null) return;
      if (!next) { if (!d.acceptExhausted) tx.update(ref, { acceptExhausted: true }); result = { exhausted: true, d: d }; return; }
      tx.set(rotRef, { queue: applyReassignToQueue(queue, d.assignedTo, next), updatedAt: FieldValue.serverTimestamp() }, { merge: true });
      tx.update(ref, {
        assignedTo: next, passedFrom: FieldValue.arrayUnion(d.assignedTo),
        acceptDeadline: firebase.firestore.Timestamp.fromMillis(Date.now() + ACCEPT_WINDOW_MS),
        acceptExhausted: false, reassignCount: FieldValue.increment(1), lastReassignAt: FieldValue.serverTimestamp()
      });
      result = { from: d.assignedTo, to: next, d: d };
    });
  }).then(function () {
    if (result && result.to) {
      callNotify('lead-reassigned', leadId);
      addNotification('csAdmin', 'followup', 'Lead dialihkan ke ' + result.to, (result.d.buyerName || 'Lead') + ': ' + result.from + ' tidak menerima.', leadId);
    } else if (result && result.exhausted && force) alert('Tidak ada marketing lain di rotasi yang belum dilewati lead ini.');
  }).catch(function (err) { console.error('Gagal mengalihkan lead:', err); if (force) alert('Gagal mengalihkan lead: ' + err.message); })
    .finally(function () { reassignInFlight.delete(leadId); });
}

setInterval(function () {

}, 1000);

function loadKpiV2(month, force) {
  const isMk = role === 'marketing';
  const key = currentUser.uid + '|' + month;
  const c = kpiCacheV2[key];
  if (!force && c && Date.now() - c.loadedAt < KPI_CACHE_MS) return Promise.resolve(c);
  if (!force && kpiInflight[key]) return kpiInflight[key];
  const range = kpiMonthRange(month);
  const people = isMk ? [{ uid: currentUser.uid, name: currentUser.name }] : activeMarketingUsers().map(function (u) { return { uid: u.uid, name: u.name }; });
  const cfgP = db.collection('settings').doc('kpi').get().then(function (s) { kpiConfig = s.exists ? s.data() : null; }).catch(function () {});
  const snapsP = (isMk
    ? db.collection('kpiDaily').doc(kpiSnapDocId(month, currentUser.uid)).get().then(function (s) { return s.exists ? [s.data()] : []; })
    : db.collection('kpiDaily').where('ym', '==', month).get().then(function (s) { return s.docs.map(function (d) { return d.data(); }); })
  ).catch(function () { return []; });
  const p = Promise.all([cfgP, snapsP]).then(function (res) {
    const snaps = {};
    res[1].forEach(function (s) { if (s && s.uid) snaps[s.uid] = s; });
    const asOfs = people.map(function (x) { return snaps[x.uid] ? snaps[x.uid].asOf : ''; });
    const target = kpiSnapTargetAsOf(month);
    const usable = people.length > 0 && asOfs[0] && asOfs.every(function (a) { return a === asOfs[0]; }) &&
      (isMk || !kpiCanVerify() || !target || asOfs[0] >= target);
    return usable ? kpiLoadFromSnaps(month, range, people, snaps, isMk) : kpiLoadFull(month, range, people, isMk);
  }).then(function (data) { kpiCacheV2[key] = data; return data; })
    .finally(function () { delete kpiInflight[key]; });
  kpiInflight[key] = p;
  return p;
}

// ---------- Target harian (beranda marketing) ----------
// Target harian = target bulanan / 25 hari kerja (patokan presensi KPI lama).
// Libur marketing tidak menentu (4x sebulan), jadi "Butuh X per hari" baru tampil mulai tanggal 25:
// sisa target bulan ini / sisa hari di bulan ini (termasuk hari ini).
const KPI_WORKDAYS = 25;
const KPI_NEED_FROM_DAY = 25;
function workdaysLeft() {
  const n = new Date(), last = new Date(n.getFullYear(), n.getMonth() + 1, 0).getDate();
  return Math.max(1, last - n.getDate() + 1);
}
function todayCounts(r) {
  const key = kpiDateKey(new Date());
  let fu = 0, db = 0;
  marketingLeadsData.forEach(function (l) {
    if (l.pendingAccept === true) return;
    if (l.isSelfInput === true && l.createdAt && kpiDateKey(toJsDate(l.createdAt)) === key) db++;
    // sama dengan aturan KPI: maksimal 1 follow up per lead per hari
    if ((Array.isArray(l.notes) ? l.notes : []).some(function (n) { return n && n.date && kpiDateKey(toJsDate(n.date)) === key; })) fu++;
  });
  const rep = r.reports ? r.reports.some(function (x) { return x.dateKey === key && !x.invalid; }) : null;
  return { followUp: fu, dbBaru: db, online: rep };
}
function todaySection() {
  if (!myKpi || myKpi.month !== kpiCurrentMonth()) return '';
  const r = myKpi.rows[0], items = kpiItems(), today = todayCounts(r), left = workdaysLeft();
  if (!r.reports) kpiFetchRowReports(r, false);
  const showNeed = new Date().getDate() >= KPI_NEED_FROM_DAY;
  const rows = ['followUp', 'dbBaru', 'online'].map(function (key) {
    const it = items.find(function (x) { return x.key === key; });
    if (!it) return '';
    const daily = Math.max(1, Math.round(it.target / KPI_WORKDAYS));
    const remaining = Math.max(0, it.target - (Number(r.counts[key]) || 0));
    const need = Math.ceil(remaining / left);
    let note = '';
    if (!remaining) note = '<div class="tiny" style="color:#1F7A4D;margin-top:6px">Target bulan ini sudah tercapai</div>';
    else if (!showNeed) note = '';
    else if (key === 'online') {
      if (remaining >= left) note = '<div class="tiny" style="color:#A55E00;margin-top:6px">' + (remaining > left ? 'Lapor setiap hari tersisa, maksimal tercapai ' + ((Number(r.counts.online) || 0) + left) + ' dari ' + it.target + ' hari' : 'Butuh lapor setiap hari tersisa') + '</div>';
    } else if (need > daily) note = '<div class="tiny" style="color:#A55E00;margin-top:6px">Butuh ' + need + ' per hari agar target bulan ini tercapai</div>';
    if (key === 'online') {
      const done = today.online;
      return '<div class="row" style="flex-direction:column;align-items:stretch;padding:13px 16px"><div class="hstack"><div class="t" style="flex:1">Lapor Live / Canvasing</div>' +
        (done === null ? '<span class="muted tiny">Memuat…</span>' : done ? '<span class="pill p-green">Sudah</span>' : '<button class="pill p-blue" style="border:0" onclick="openSheet(\'report\')">Belum · Lapor</button>') + '</div>' + note + '</div>';
    }
    const v = today[key], ok = v >= daily;
    return '<div class="row" style="flex-direction:column;align-items:stretch;gap:8px;padding:13px 16px"><div class="hstack"><div class="t" style="flex:1">' + esc(it.label) + '</div>' +
      '<b class="num">' + v + '<span class="muted" style="font-weight:400"> / ' + daily + '</span></b></div>' +
      '<div class="bar"><i style="width:' + Math.min(100, v / daily * 100) + '%;background:' + (ok ? 'var(--green)' : 'var(--tint)') + '"></i></div>' + note + '</div>';
  }).join('');
  return '<div class="section-h"><h2>Hari ini</h2><span class="muted tiny">' + 'Sisa ' + left + ' hari bulan ini' + '</span></div><div class="group">' + rows + '</div>';
}

// ITJ & SPPR dari buyer (lead) yang sama ditampilkan sebagai SATU closing. Perhitungan KPI tetap
// per tahap (Closing ITJ 15%, Closing SPPR 35%); ini hanya tampilan.
function groupClosings(closings) {
  const by = {}, out = [];
  (closings || []).forEach(function (c) {
    let g = by[c.lead.id];
    if (!g) { g = by[c.lead.id] = { lead: c.lead, itj: null, sppr: null, date: c.date }; out.push(g); }
    g[c.key] = c;
    if (c.date > g.date) g.date = c.date;
  });
  out.forEach(function (g) {
    // Tahap yang perlu diputuskan SPV: SPPR kalau ada & menunggu, selain itu ITJ yang menunggu.
    g.pendingKey = g.sppr && g.sppr.status === 'pending' ? 'sppr' : g.itj && g.itj.status === 'pending' ? 'itj' : '';
    g.mainKey = g.sppr ? 'sppr' : 'itj';
  });
  return out.sort(function (a, b) { return b.date - a.date; });
}
function countPendingClosings(rows) {
  return rows.reduce(function (s, r) { return s + groupClosings(r.closings).filter(function (g) { return g.pendingKey; }).length; }, 0);
}
function stageChip(c, label) {
  if (!c) return '';
  const cls = c.status === 'approved' ? 'p-green' : c.status === 'rejected' ? 'p-red' : 'p-orange';
  const txt = c.status === 'approved' ? 'disetujui' : c.status === 'rejected' ? 'ditolak' : 'menunggu';
  return '<span class="pill ' + cls + '">' + label + ' ' + txt + '</span>';
}
function closingInfoLine(g) {
  const info = kpiClosingInfo(g.lead, g.mainKey);
  return esc(info.project || g.lead.project || '-') + ' · ' + formatDateID(g.date) + (info.unit ? ' · Unit ' + esc(info.unit) : '') + (info.nominal ? ' · ' + esc(formatRupiahText(info.nominal)) : '');
}
function closingActions(g, tall) {
  if (!g.pendingKey || !kpiCanVerify()) return '';
  const h = tall ? 42 : 38, label = g.pendingKey === 'sppr' ? 'SPPR' : 'ITJ', id = esc(g.lead.id);
  return '<div class="grid2" style="margin-top:' + (tall ? 14 : 6) + 'px"><button class="btn btn-danger" style="height:' + h + 'px;font-size:15px" onclick="verifyClosing(\'' + id + '\',\'' + g.pendingKey + '\',\'rejected\')">Tolak ' + label + '</button>' +
    '<button class="btn btn-primary" style="height:' + h + 'px;font-size:15px" onclick="verifyClosing(\'' + id + '\',\'' + g.pendingKey + '\',\'approved\')">Setujui ' + label + '</button></div>';
}

function trendCardHtml(uid, liveScore) {
  const c = trendCache[uid];
  if (!c || c.loading) { loadTrend(uid); return '<div class="card loading" style="padding:18px">Memuat tren…</div>'; }
  const cur = kpiCurrentMonth();
  const pts = kpiTrendMonthList().map(function (ym) {
    if (ym === cur) return { ym: ym, v: liveScore, live: true };
    const m = c.months[ym]; return { ym: ym, v: m && Number.isFinite(Number(m.total)) ? Number(m.total) : null, live: false };
  });
  const finals = pts.filter(function (p) { return p.v != null && !p.live; });
  const W = 320, H = 150, L = 18, R = 300, T = 22, B = 118, step = (R - L) / (pts.length - 1);
  const x = function (i) { return L + i * step; }, y = function (v) { return B - Math.max(0, Math.min(100, v)) / 100 * (B - T); };
  let g = '';
  [0, 50, 100].forEach(function (v) { g += '<line x1="' + L + '" x2="' + R + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="var(--fill2)" stroke-width="1"/>'; });
  for (let i = 1; i < pts.length; i++) if (pts[i - 1].v != null && pts[i].v != null)
    g += '<line x1="' + x(i - 1) + '" y1="' + y(pts[i - 1].v) + '" x2="' + x(i) + '" y2="' + y(pts[i].v) + '" stroke="var(--tint)" stroke-width="2.2" stroke-linecap="round"' + (pts[i].live ? ' stroke-dasharray="4 4"' : '') + '/>';
  let lastFinal = -1; pts.forEach(function (p, i) { if (p.v != null && !p.live) lastFinal = i; });
  pts.forEach(function (p, i) {
    g += '<text x="' + x(i) + '" y="' + (H - 10) + '" font-size="11" text-anchor="middle" fill="' + (p.live ? 'var(--label)' : 'var(--label2)') + '" font-weight="' + (p.live ? 600 : 400) + '">' + kpiMonthShort(p.ym) + '</text>';
    if (p.v == null) return;
    g += '<circle cx="' + x(i) + '" cy="' + y(p.v) + '" r="4.5" fill="' + (p.live ? '#fff' : 'var(--tint)') + '" stroke="' + (p.live ? 'var(--tint)' : '#fff') + '" stroke-width="2"/>';
    if (i === lastFinal || p.live) g += '<text x="' + (i === pts.length - 1 ? x(i) + 4 : x(i)) + '" y="' + (y(p.v) - 10) + '" font-size="11.5" text-anchor="' + (i === pts.length - 1 ? 'end' : 'middle') + '" font-weight="600" fill="var(--label)">' + fmt(p.v) + '</text>';
  });
  let sum;
  if (finals.length >= 2) { const a = finals[finals.length - 2], b = finals[finals.length - 1], dd = b.v - a.v; sum = kpiMonthLabel(b.ym) + ' ' + fmt(b.v) + ' · ' + (Math.abs(dd) < 0.05 ? 'sama dengan ' : (dd > 0 ? 'naik ' : 'turun ') + fmt(Math.abs(dd)) + ' dari ') + KPI_MONTH_NAMES[Number(a.ym.slice(5)) - 1]; }
  else if (finals.length === 1) sum = kpiMonthLabel(finals[0].ym) + ' ' + fmt(finals[0].v) + ' (baru 1 bulan direkap)';
  else sum = 'Grafik terisi otomatis setelah rekap bulan lalu disimpan (tanggal 3).';
  return '<div class="card"><div class="muted tiny">' + esc(sum) + '</div><svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" style="margin-top:8px;display:block" role="img" aria-label="Tren skor KPI 6 bulan">' + g + '</svg>' +
    '<div class="muted tiny">Titik berongga = bulan berjalan (belum final).</div></div>';
}

function findSpamRecordV2(raw) {

function csSaveLead() {

  const buyerName = String(f.csName || '').trim(), waNumber = String(f.csWa || '').trim(), adSource = String(f.csSource || '').trim(), project = f.csProject || '', csNote = String(f.csNote || '').trim();
  if (!buyerName || !waNumber || !adSource || !project) return csErr('Lengkapi nama, nomor WhatsApp, sumber iklan, dan proyek.');
  if (!isAd && !f.csAssign) return csErr('Pilih marketing yang ditugaskan.');
  if (isAd && !csRotationList().length) return csErr('Belum ada marketing aktif yang ikut rotasi iklan. Minta Super Admin mengaturnya di Kelola Akun.');
  const waErr = validateWaNumber(waNumber); if (waErr) return csErr(waErr);
  const btn = $('csSave'); btn.disabled = true; btn.textContent = 'Memeriksa nomor…';
  csLeadDupCheck(waNumber).then(function (matches) {
    if (matches.length && !confirm(buildDuplicateWarning(matches))) return false;
    return findSpamRecordV2(waNumber).then(function (spam) { return !spam || confirm('Peringatan: nomor ini pernah dicatat sebagai SPAM (' + spamDesc(spam) + ').\n\nTetap simpan sebagai lead?'); });
  }).then(function (go2) {

      assignedTo: isAd ? '' : f.csAssign, csNote: csNote, isAdLead: isAd, status: 'New', isHot: false, nextFollowUpDate: defaultNextFollowUp(),
      pendingAccept: true, acceptDeadline: firebase.firestore.Timestamp.fromMillis(Date.now() + ACCEPT_WINDOW_MS), passedFrom: [],
      createdAt: FieldValue.serverTimestamp(), lastUpdated: FieldValue.serverTimestamp()
    };

    let p;
    if (isAd) {
      const rotRef = db.collection('settings').doc('adRotation'), list = csRotationList();

          const q = normalizeRotationQueue(rot.queue, list, counter);

          tx.set(ref, data);

const ROLE_LABELS = { SuperAdmin: 'Super Admin', Admin: 'SPV/Manager', CS: 'CS', Marketing: 'Marketing' };
const MANAGE_ROLE_ORDER = ['SuperAdmin', 'Admin', 'CS', 'Marketing'];
let manageAllLeads = null;          // SEMUA lead (termasuk Closed/Lost lama) — dimuat saat Kelola Akun dibuka
let credentialsData = {};
function isSuperAdminUser() { return !!currentUser && currentUser.role === 'SuperAdmin'; }
function emailToId(email) {
  const e = String(email || ''), suffix = '@' + String(APP.emailDomain || '').toLowerCase();
  return e.toLowerCase().slice(-suffix.length) === suffix ? e.slice(0, -suffix.length) : e;
}
function findUserByUid(uid) { return usersData.find(function (u) { return u.uid === uid; }) || null; }
function mgLeads() { return manageAllLeads || allLeadsData; }
function activeLeadsOf(name) { return mgLeads().filter(function (l) { return l.assignedTo === name && CLOSED_STATUSES.indexOf(l.status) === -1; }); }
function allLeadsOf(name) { return mgLeads().filter(function (l) { return l.assignedTo === name; }); }
function nextRotationOrder() {
  let max = 0;
  usersData.forEach(function (u) { if (u.role === 'Marketing' && Number.isFinite(u.rotationOrder)) max = Math.max(max, u.rotationOrder); });
  return max + 1;
}
function randomPassword() {
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789', buf = new Uint32Array(10);
  (window.crypto || window.msCrypto).getRandomValues(buf);
  return Array.from(buf).map(function (n) { return chars[n % chars.length]; }).join('');
}
function authErrorMessage(err) {
  const code = err && err.code;
  if (code === 'auth/email-already-in-use') return 'ID ini sudah terdaftar. Kalau akunnya pernah dinonaktifkan, aktifkan lagi dari daftar akun nonaktif.';
  if (code === 'auth/invalid-email') return 'Format email tidak valid.';
  if (code === 'auth/weak-password') return 'Password terlalu lemah (minimal 6 karakter).';
  if (code === 'auth/operation-not-allowed') return 'Login Email/Password belum diaktifkan di Firebase Console (Authentication > Sign-in method).';
  if (code === 'auth/network-request-failed') return 'Koneksi internet bermasalah, coba lagi.';
  if (code === 'auth/user-not-found') return 'Akun login dengan email ini tidak ditemukan.';
  return (err && err.message) || String(err);
}
function getUserAdminAuth() {
  const existing = firebase.apps.find(function (a) { return a.name === 'userAdmin'; });
  return (existing || firebase.initializeApp(APP.firebase, 'userAdmin')).auth();
}
function credentialDoc(email, password) { return { email: email, password: password, updatedAt: FieldValue.serverTimestamp(), updatedBy: currentUser ? currentUser.uid : '' }; }
function createLoginAccount(email, password, profile) {
  const auth2 = getUserAdminAuth();
  return auth2.setPersistence(firebase.auth.Auth.Persistence.NONE)
    .then(function () { return auth2.createUserWithEmailAndPassword(email, password); })
    .then(function (cred) {
      const nu = cred.user, batch = db.batch();
      batch.set(db.collection('users').doc(nu.uid), profile);
      batch.set(db.collection('credentials').doc(nu.uid), credentialDoc(email, password));
      return batch.commit().catch(function (err) { return nu.delete().catch(function () {}).then(function () { throw err; }); });
    })
    .finally(function () { return auth2.signOut().catch(function () {}); });
}
function commitInChunks(items, applyFn) {
  const chunks = [];
  for (let i = 0; i < items.length; i += 400) chunks.push(items.slice(i, i + 400));
  return chunks.reduce(function (prev, chunk) {
    return prev.then(function () { const b = db.batch(); chunk.forEach(function (it) { applyFn(b, it); }); return b.commit(); });
  }, Promise.resolve());
}
function copyText(text, btn) {
  const done = function () { if (btn) btn.textContent = 'Tersalin ✓'; };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(function () { alert('Gagal menyalin, salin manual dari kotak di atas.'); });
  else alert('Browser tidak mendukung salin otomatis, salin manual dari kotak di atas.');
}

// ---------- Sheet Kelola Akun & Proyek ----------
function mgForm() { return sheetState && sheetState.kind === 'manage' ? sheetState.form : null; }
function mgGo(view, extra) { const f = mgForm(); if (!f || f.busy) return; Object.assign(f, { view: view, notice: '', err: '' }, extra || {}); renderSheet(); $('sheet').scrollTop = 0; }
function mgTab(tab) { const f = mgForm(); if (!f || f.busy) return; f.tab = tab; f.view = 'list'; f.notice = ''; renderSheet(); }
function mgBusy(on, btnId, label) { const f = mgForm(); if (f) f.busy = on; if (btnId && $(btnId)) { $(btnId).disabled = on; if (label) $(btnId).textContent = label; } }
function mgLoadData() {
  const f = mgForm();
  if (!f) return;
  f.loading = true;
  Promise.all([
    db.collection('leads').get().then(function (s) { manageAllLeads = s.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); }); }),
    db.collection('credentials').get().then(function (s) { credentialsData = {}; s.docs.forEach(function (d) { credentialsData[d.id] = d.data(); }); })
      .catch(function (e) { console.warn('Tidak bisa membaca credentials:', e); })
  ]).catch(function (e) { f.loadErr = e.message; })
    .finally(function () { f.loading = false; if (mgForm() === f) renderSheet(); });
}
function mgBtn(label, js, kind) {
  return '<button class="btn ' + (kind === 'danger' ? 'btn-danger' : kind === 'primary' ? 'btn-primary' : 'btn-tinted') + '" style="width:auto;height:32px;padding:0 12px;font-size:13.5px" onclick="' + js + '">' + label + '</button>';
}
function mgNotice(f) { return f.notice ? '<div class="card" style="background:var(--green-soft);color:#1F7A4D;padding:12px 16px;margin-bottom:12px;font-size:14.5px">' + esc(f.notice) + '</div>' : ''; }
function mgErr(f) { return f.err ? '<p class="err">' + esc(f.err) + '</p>' : ''; }
SHEETS.manage = function () {
  if (!isSuperAdminUser()) return sheetHead('Kelola Akun') + '<div class="card empty">Khusus Super Admin.</div>';
  const f = sheetState.form;
  if (!f.init) { f.init = true; f.tab = 'users'; f.view = 'list'; mgLoadData(); }
  const back = f.view !== 'list' ? '<button class="btn-plain" onclick="mgGo(\'list\')">Kembali</button>' : '';
  const seg = f.view === 'list' ? '<div class="seg" style="margin-top:0;margin-bottom:12px"><button class="' + (f.tab === 'users' ? 'on' : '') + '" onclick="mgTab(\'users\')">Akun</button><button class="' + (f.tab === 'projects' ? 'on' : '') + '" onclick="mgTab(\'projects\')">Proyek</button><button class="' + (f.tab === 'reset' ? 'on' : '') + '" onclick="mgTab(\'reset\')">Reset Data</button></div>' : '';
  let body;
  if (f.tab === 'projects') body = mgProjects(f);
  else if (f.tab === 'reset') body = mgReset(f);
  else if (f.loading) body = '<div class="loading">Memuat semua data lead & akun…</div>';
  else if (f.view === 'add' || f.view === 'edit') body = mgUserForm(f);
  else if (f.view === 'created') body = mgCreated(f);
  else if (f.view === 'setPassword') body = mgSetPassword(f);
  else if (f.view === 'deactivate') body = mgDeactivate(f);
  else if (f.view === 'purge') body = mgPurge(f);
  else if (f.view === 'bulk') body = mgBulk(f);
  else if (f.view === 'bulkResult') body = mgBulkResult(f);
  else body = mgUserList(f);
  return sheetHead('Kelola Akun & Proyek', back) + seg + body;
};

// ---------- Daftar akun ----------
function mgUserList(f) {
  const inactive = usersData.filter(function (u) { return !isActiveUser(u); }).length;
  const visible = usersData.filter(function (u) { return f.showInactive || isActiveUser(u); });
  let html = mgNotice(f) + (f.loadErr ? '<p class="err">Gagal memuat data: ' + esc(f.loadErr) + '</p>' : '') +
    '<div class="grid2"><button class="btn btn-primary" style="height:42px;font-size:15px" onclick="mgGo(\'add\')">+ Tambah Akun</button><button class="btn btn-tinted" style="height:42px;font-size:15px" onclick="mgGo(\'bulk\')">Impor Banyak</button></div>' +
    (inactive ? '<button class="btn-plain tiny" style="margin-top:10px" onclick="sheetState.form.showInactive=!sheetState.form.showInactive;renderSheet()">' + (f.showInactive ? 'Sembunyikan' : 'Tampilkan') + ' akun nonaktif (' + inactive + ')</button>' : '');
  MANAGE_ROLE_ORDER.concat(['__other__']).forEach(function (r) {
    const list = visible.filter(function (u) { return r === '__other__' ? MANAGE_ROLE_ORDER.indexOf(u.role) === -1 : u.role === r; }).sort(function (a, b) {
      if (r === 'Marketing') { const oa = Number.isFinite(a.rotationOrder) ? a.rotationOrder : 9999, ob = Number.isFinite(b.rotationOrder) ? b.rotationOrder : 9999; if (oa !== ob) return oa - ob; }
      return String(a.name || '').localeCompare(String(b.name || ''));
    });
    if (!list.length) return;
    html += '<div class="section-h"><h2 style="font-size:17px">' + esc(r === '__other__' ? 'Role tidak dikenal' : ROLE_LABELS[r]) + ' (' + list.length + ')</h2></div><div class="group">' + list.map(mgUserRow).join('') + '</div>';
  });
  return html;
}
function mgUserRow(u) {
  const isMe = u.uid === currentUser.uid, active = isActiveUser(u), uid = esc(u.uid);
  let meta = 'ID: ' + esc(emailToId(u.email) || '-');
  if (u.role === 'Marketing') meta += ' · Grup ' + (u.group === 'B' ? 'B' : 'A') + ' · ' + (u.inRotation === false ? 'tidak ikut rotasi' : 'rotasi #' + (Number.isFinite(u.rotationOrder) ? u.rotationOrder : '-')) + ' · WA ' + esc(u.waNumber || '-') + ' · ' + activeLeadsOf(u.name).length + ' lead aktif';
  const warn = u.role === 'Marketing' && active && validateWaNumber(u.waNumber || '') ? '<div class="s wrap" style="color:#A55E00">Nomor WA belum valid, pengingat WA tidak bisa dikirim.</div>' : '';
  const b = [];
  if (active) {
    b.push(mgBtn('Ubah', "mgGo('edit',{uid:'" + uid + "'})"));
    if (credentialsData[u.uid]) { b.push(mgBtn('Lihat Password', "mgShowPassword('" + uid + "')")); if (!isMe) b.push(mgBtn('Atur Ulang Password', "mgGo('setPassword',{uid:'" + uid + "'})")); }
    else b.push(mgBtn('Reset Password (email)', "mgSendReset('" + uid + "')"));
    if (!isMe) b.push(mgBtn('Nonaktifkan', "mgStartDeactivate('" + uid + "')", 'danger'));
  } else {
    b.push(mgBtn('Aktifkan Lagi', "mgReactivate('" + uid + "')", 'primary'));
    if (!isMe) b.push(mgBtn('Hapus Permanen', "mgGo('purge',{uid:'" + uid + "'})", 'danger'));
  }
  return '<div class="row" style="flex-direction:column;align-items:stretch;gap:8px' + (active ? '' : ';opacity:.75') + '"><div class="main"><div class="t">' + esc(u.name || '(tanpa nama)') + (isMe ? ' <span class="muted tiny">(Anda)</span>' : '') + (active ? '' : ' <span class="pill p-gray">Nonaktif</span>') + '</div>' +
    '<div class="s wrap">' + meta + '</div>' + warn + '</div><div class="hstack" style="gap:6px;flex-wrap:wrap">' + b.join('') + '</div></div>';
}

// ---------- Form tambah / ubah akun ----------
function mgUserForm(f) {
  const isEdit = f.view === 'edit', u = isEdit ? findUserByUid(f.uid) : null;
  if (isEdit && !u) return mgUserList(f);
  const isMe = isEdit && u.uid === currentUser.uid, r = f.role || (u ? u.role : 'Marketing');
  const nameLocked = isEdit && u.role === 'Marketing' && allLeadsOf(u.name).length > 0;
  const v = function (x) { return esc(x == null ? '' : x); };
  const roleOpts = MANAGE_ROLE_ORDER.slice().reverse().map(function (x) { return '<option value="' + x + '"' + (x === r ? ' selected' : '') + '>' + ROLE_LABELS[x] + '</option>'; }).join('');
  return '<h3 style="margin:0 0 12px;font-size:19px">' + (isEdit ? 'Ubah Akun: ' + v(u.name) : 'Tambah Akun Baru') + '</h3>' +
    '<label class="field"><span>Nama</span><input id="ufName" maxlength="60" value="' + v(u && u.name) + '"' + (nameLocked ? ' readonly' : '') + ' placeholder="Budi"></label>' +
    '<p class="foot">' + (nameLocked ? 'Nama marketing ini tidak bisa diubah karena sudah tercatat sebagai pemilik lead.' : 'Untuk marketing, nama ini tampil di data lead & pesan WA, dan harus unik.') + '</p>' +
    '<label class="field"><span>Role</span><select id="ufRole" onchange="mgCaptureUser();sheetState.form.role=this.value;renderSheet()"' + (isMe ? ' disabled' : '') + '>' + roleOpts + '</select></label>' +
    '<p class="foot">' + (isMe ? 'Role akun Anda sendiri tidak bisa diubah.' : 'SPV/Manager & Super Admin: memantau semua lead. CS: input lead. Marketing: follow-up lead miliknya.') + '</p>' +
    (isEdit ? '<div class="card" style="padding:12px 16px;margin-top:10px"><div class="muted tiny">ID login</div><div>' + v(emailToId(u.email) || '-') + '</div></div>'
      : '<label class="field"><span>ID login</span><input id="ufId" autocomplete="off" autocapitalize="none" spellcheck="false" value="' + v(f.draftId) + '" placeholder="angga"></label><p class="foot">Huruf kecil/angka tanpa spasi. Dipakai untuk login.</p>' +
        '<div class="hstack" style="gap:8px;margin-top:10px"><label class="field" style="flex:1;margin:0"><span>Password awal</span><input id="ufPw" autocomplete="new-password" value="' + v(f.draftPw) + '" placeholder="Minimal 6 karakter"></label><button class="btn btn-tinted" style="width:auto;padding:0 14px;height:52px" onclick="$(\'ufPw\').value=randomPassword()">Acak</button></div>') +
    (r === 'Marketing' ? '<div class="section-h"><h2 style="font-size:17px">Data marketing</h2></div>' +
      '<label class="field"><span>Nomor WhatsApp</span><input id="ufWa" type="tel" value="' + v(f.draftWa != null ? f.draftWa : u && u.waNumber) + '" placeholder="0812xxxxxxx"></label>' +
      '<div class="grid2" style="margin-top:10px"><label class="field"><span>Grup pengingat</span><select id="ufGroup"><option value="A"' + (!u || u.group !== 'B' ? ' selected' : '') + '>Grup A</option><option value="B"' + (u && u.group === 'B' ? ' selected' : '') + '>Grup B</option></select></label>' +
      '<label class="field"><span>Urutan rotasi</span><input id="ufOrder" type="number" min="1" step="1" value="' + v(u && Number.isFinite(u.rotationOrder) ? u.rotationOrder : nextRotationOrder()) + '"></label></div>' +
      '<label class="row card" style="margin-top:10px;padding:12px 16px;min-height:0"><input id="ufRot" type="checkbox"' + (!u || u.inRotation !== false ? ' checked' : '') + ' style="width:20px;height:20px"><div class="main"><div class="t">Ikut rotasi lead iklan</div><div class="s wrap">Lead dari input Iklan dibagi bergiliran ke marketing yang dicentang.</div></div></label>' : '') +
    mgErr(f) + '<button class="btn btn-primary" style="margin-top:16px" id="ufSave" onclick="mgSubmitUser()">' + (isEdit ? 'Simpan Perubahan' : 'Buat Akun') + '</button>';
}
function mgCaptureUser() { const f = mgForm(); if (!f) return; if ($('ufId')) f.draftId = $('ufId').value; if ($('ufPw')) f.draftPw = $('ufPw').value; if ($('ufWa')) f.draftWa = $('ufWa').value; }
function mgFail(msg) { const f = mgForm(); mgCaptureUser(); f.err = msg; renderSheet(); }
function mgSubmitUser() {
  const f = mgForm();
  if (!isSuperAdminUser() || !f || f.busy) return;
  const isEdit = f.view === 'edit', u = isEdit ? findUserByUid(f.uid) : null;
  if (isEdit && !u) return mgGo('list');
  const name = $('ufName').value.trim().replace(/\s+/g, ' '), isMe = isEdit && u.uid === currentUser.uid;
  const r = isMe ? u.role : $('ufRole').value;
  if (!name) return mgFail('Nama wajib diisi.');
  if (MANAGE_ROLE_ORDER.indexOf(r) === -1) return mgFail('Pilih role yang valid.');
  if (isEdit && u.role === 'Marketing') {
    if (name !== u.name && allLeadsOf(u.name).length) return mgFail('Nama marketing tidak bisa diubah karena sudah memegang lead.');
    const aktif = activeLeadsOf(u.name).length;
    if (r !== 'Marketing' && aktif) return mgFail(u.name + ' masih memegang ' + aktif + ' lead aktif. Pindahkan dulu lead-nya (lewat Nonaktifkan) sebelum mengganti role.');
  }
  let mk = null;
  if (r === 'Marketing') {
    const wa = $('ufWa').value.trim(), waErr = validateWaNumber(wa);
    if (waErr) return mgFail(waErr);
    const dup = usersData.find(function (x) { return x.role === 'Marketing' && (!u || x.uid !== u.uid) && String(x.name || '').trim().toLowerCase() === name.toLowerCase(); });
    if (dup) return mgFail('Nama marketing "' + name + '" sudah dipakai' + (isActiveUser(dup) ? '' : ' oleh akun nonaktif') + '. Nama marketing harus unik. Tambahkan pembeda, mis. "' + name + ' R".');
    const ord = parseInt($('ufOrder').value, 10);
    mk = { waNumber: wa, group: $('ufGroup').value === 'B' ? 'B' : 'A', inRotation: $('ufRot').checked, rotationOrder: Number.isFinite(ord) && ord > 0 ? ord : nextRotationOrder() };
  }
  if (isEdit) {
    mgBusy(true, 'ufSave', 'Menyimpan…');
    db.collection('users').doc(u.uid).update(Object.assign({ name: name, role: r, updatedAt: FieldValue.serverTimestamp(), updatedBy: currentUser.uid }, mk || {}))
      .then(function () { f.busy = false; mgGo('list'); f.notice = 'Perubahan akun ' + name + ' tersimpan.'; renderSheet(); })
      .catch(function (e) { f.busy = false; mgFail('Gagal menyimpan: ' + e.message); });
    return;
  }
  const rawId = $('ufId').value.trim().toLowerCase(), email = idToEmail(rawId), pw = $('ufPw').value;
  if (!isValidLoginId(rawId)) return mgFail('ID hanya boleh huruf kecil, angka, titik, strip, atau garis bawah (3-30 karakter), tanpa spasi.');
  if (usersData.some(function (x) { return String(x.email || '').toLowerCase() === email; })) return mgFail('ID "' + rawId + '" sudah dipakai.');
  if (pw.length < 6) return mgFail('Password minimal 6 karakter.');
  const profile = Object.assign({ name: name, email: email, role: r, active: true, createdAt: FieldValue.serverTimestamp(), createdBy: currentUser.uid, updatedAt: FieldValue.serverTimestamp() }, mk || {});
  mgBusy(true, 'ufSave', 'Membuat akun…');
  createLoginAccount(email, pw, profile)
    .then(function () { f.busy = false; credentialsData = credentialsData || {}; mgGo('created', { created: { name: name, email: email, password: pw, role: r }, draftId: '', draftPw: '', draftWa: null, role: null }); mgLoadData(); })
    .catch(function (e) { f.busy = false; mgFail('Gagal membuat akun: ' + authErrorMessage(e)); });
}
function mgCreated(f) {
  const c = f.created;
  if (!c) return mgUserList(f);
  const link = APP.crmUrl ? String(APP.crmUrl).replace(/\/+$/, '') + '/v2/' : '';
  const text = 'Akun ' + APP.appName + '\nNama: ' + c.name + '\nRole: ' + (ROLE_LABELS[c.role] || c.role) + '\nID: ' + emailToId(c.email) + '\nPassword: ' + c.password + (link ? '\nLink: ' + link : '');
  const title = c.mode === 'view' ? 'Data login ' + c.name : c.mode === 'reset' ? 'Password ' + c.name + ' berhasil diatur ulang.' : 'Akun ' + c.name + ' berhasil dibuat.';
  f.copyText = text;
  return '<div class="card" style="background:var(--green-soft);color:#1F7A4D"><div style="font-weight:600">' + esc(title) + '</div><div class="small" style="margin-top:4px">Berikan data login ini ke yang bersangkutan. Password bisa dilihat lagi lewat "Lihat Password".</div></div>' +
    '<pre class="card" style="white-space:pre-wrap;word-break:break-word;font-size:14.5px;margin-top:12px;font-family:inherit">' + esc(text) + '</pre>' +
    '<div class="grid2" style="margin-top:12px"><button class="btn btn-tinted" onclick="copyText(sheetState.form.copyText,this)">Salin</button><button class="btn btn-primary" onclick="mgGo(\'list\')">Daftar Akun</button></div>';
}
function mgShowPassword(uid) {
  const u = findUserByUid(uid), c = credentialsData[uid];
  if (!u || !c) return;
  mgGo('created', { created: { name: u.name, email: u.email || c.email, password: c.password, role: u.role, mode: 'view' } });
}
function mgSetPassword(f) {
  const u = findUserByUid(f.uid);
  if (!u) return mgUserList(f);
  return '<h3 style="margin:0 0 6px;font-size:19px">Atur Ulang Password: ' + esc(u.name) + '</h3><p class="foot" style="margin-top:0">ID: ' + esc(emailToId(u.email)) + '. Password lama langsung tidak berlaku. Sesi yang sedang login tetap jalan sampai logout.</p>' +
    '<div class="hstack" style="gap:8px;margin-top:10px"><label class="field" style="flex:1;margin:0"><span>Password baru</span><input id="spPw" autocomplete="new-password" placeholder="Minimal 6 karakter"></label><button class="btn btn-tinted" style="width:auto;padding:0 14px;height:52px" onclick="$(\'spPw\').value=randomPassword()">Acak</button></div>' +
    mgErr(f) + '<button class="btn btn-primary" style="margin-top:16px" id="spSave" onclick="mgApplyPassword()">Simpan Password</button>';
}
function mgApplyPassword() {
  const f = mgForm(), u = findUserByUid(f.uid), c = credentialsData[f.uid], pw = $('spPw').value;
  if (!u || !c || f.busy) return;
  if (pw.length < 6) { f.err = 'Password minimal 6 karakter.'; renderSheet(); return; }
  if (c.password === pw) { f.err = 'Password baru sama dengan password sekarang.'; renderSheet(); return; }
  const auth2 = getUserAdminAuth();
  mgBusy(true, 'spSave', 'Menyimpan…');
  auth2.setPersistence(firebase.auth.Auth.Persistence.NONE)
    .then(function () { return auth2.signInWithEmailAndPassword(c.email || u.email, c.password); })
    .then(function (cred) { return cred.user.updatePassword(pw); })
    .then(function () { return db.collection('credentials').doc(u.uid).set(credentialDoc(c.email || u.email, pw)); })
    .then(function () { credentialsData[u.uid] = { email: c.email || u.email, password: pw }; f.busy = false; mgGo('created', { created: { name: u.name, email: u.email || c.email, password: pw, role: u.role, mode: 'reset' } }); })
    .catch(function (err) {
      const code = err && err.code;
      f.busy = false;
      f.err = 'Gagal mengatur ulang password: ' + ((code === 'auth/wrong-password' || code === 'auth/invalid-credential' || code === 'auth/invalid-login-credentials')
        ? 'password tersimpan sudah tidak cocok (mungkin pernah diganti di luar aplikasi). Ganti lewat Firebase Console > Authentication, atau nonaktifkan & buat ulang akunnya.' : authErrorMessage(err));
      renderSheet();
    })
    .finally(function () { auth2.signOut().catch(function () {}); });
}
function mgSendReset(uid) {
  const u = findUserByUid(uid);
  if (!u || !u.email) return;
  if (!confirm('Kirim email reset password ke ' + u.email + '?')) return;
  auth.sendPasswordResetEmail(u.email).then(function () { const f = mgForm(); f.notice = 'Email reset password terkirim ke ' + u.email + '.'; renderSheet(); })
    .catch(function (e) { alert('Gagal mengirim email reset: ' + authErrorMessage(e)); });
}

// ---------- Nonaktifkan / aktifkan lagi ----------
function mgStartDeactivate(uid) {
  const u = findUserByUid(uid);
  if (!u || uid === currentUser.uid) return;
  const aktif = u.role === 'Marketing' ? activeLeadsOf(u.name).length : 0;

function mgDeleteLoginAccount(u) {

  const auth2 = getUserAdminAuth();

    .then(function () { return auth2.signInWithEmailAndPassword(c.email || u.email, c.password); })
    .then(function (cred) { return cred.user.delete(); })

    .catch(function (err) {
      const code = err && err.code;
      if (code === 'auth/user-not-found') return 'deleted';
      if (code === 'auth/wrong-password' || code === 'auth/invalid-credential' || code === 'auth/invalid-login-credentials') return 'wrong-password';

    .finally(function () { return auth2.signOut().catch(function () {}); });
}
function mgPurgeUser() {
  const f = mgForm(), u = findUserByUid(f.uid);
  if (!u || f.busy || isActiveUser(u)) return;
  if ($('purgeConfirm').value.trim().toUpperCase() !== 'HAPUS') { alert('Ketik HAPUS untuk mengonfirmasi.'); return; }
  const target = $('purgeTarget') ? $('purgeTarget').value : '', leads = allLeadsOf(u.name), t = mgTargets(u);
  if (leads.length && !target) { alert('Pilih dulu mau diapakan lead milik ' + u.name + '.'); return; }

  let step = '', loginResult = '';

  step = 'memindahkan/menghapus lead';
  commitInChunks(leads.map(function (l, i) { return { id: l.id, i: i }; }), function (b, it) {
    const ref = db.collection('leads').doc(it.id);
    if (target === '__delete__') { b.delete(ref); return; }

  }).then(function () {

  }).then(function () {
    step = 'menghapus log pengingat';
    if (!u.name) return;
    return db.collection('reminderLogs').where('marketingName', '==', u.name).get().then(function (s) { return commitInChunks(s.docs, function (b, d) { b.delete(d.ref); }); });
  }).then(function () {
    step = 'menghapus akun login';
    return mgDeleteLoginAccount(u).then(function (r) { loginResult = r; });
  }).then(function () {
    step = 'menghapus profil akun';
    const b = db.batch(); b.delete(db.collection('credentials').doc(u.uid)); b.delete(db.collection('users').doc(u.uid)); return b.commit();
  }).then(function () {
    let msg = 'Akun ' + u.name + ' sudah dihapus permanen';
    if (leads.length) msg += target === '__delete__' ? ' beserta ' + leads.length + ' lead-nya' : ' dan ' + leads.length + ' lead sudah dipindahkan';

    f.busy = false; mgGo('list'); f.notice = msg; mgLoadData();
  }).catch(function (err) {
    f.busy = false;
    alert('Gagal ' + step + ': ' + (err && err.message) + '\n\nTekan Hapus Permanen lagi untuk melanjutkan dari langkah yang gagal.');
    renderSheet();
  });

function parseBulkRole(raw) {
  const r = String(raw || '').trim().toLowerCase().replace(/[\s_-]+/g, '');
  if (r === 'cs' || r === 'customerservice') return 'CS';
  if (['spv', 'manager', 'spv/manager', 'admin', 'supervisor', 'manajer'].indexOf(r) !== -1) return 'Admin';
  if (r === 'marketing' || r === 'sales') return 'Marketing';
  if (r === 'superadmin') return 'SuperAdmin';
  return null;
}
function mgBulk(f) {
  return '<h3 style="margin:0 0 6px;font-size:19px">Impor Banyak Akun</h3><p class="small muted" style="line-height:1.45">Satu baris untuk satu akun, kolom dipisah tanda <b>|</b>:</p>' +
    '<div class="card" style="padding:10px 14px;font-family:ui-monospace,monospace;font-size:13px;margin-top:6px">Nama | ID | Role | Password | No WA | Grup</div>' +
    '<p class="foot">Role: CS, SPV, Manager, Marketing. Password minimal 6 karakter; kosongkan untuk password acak. No WA wajib untuk Marketing; Grup A atau B (kosong = A).</p>' +
    '<label class="field"><span>Daftar akun</span><textarea id="bulkInput" rows="9" style="font-family:ui-monospace,monospace;font-size:13px" oninput="sheetState.form.bulkDraft=this.value" placeholder="Dewi | dewi | CS | dewi123&#10;Andi | andi | Marketing | andi123 | 081234567890 | A">' + esc(f.bulkDraft || '') + '</textarea></label>' +
    (f.err ? '<p class="err" style="white-space:pre-line">' + esc(f.err) + '</p>' : '') +
    '<button class="btn btn-primary" style="margin-top:16px" id="bulkBtn" onclick="mgSubmitBulk()">Periksa & Buat Akun</button>';
}
function mgSubmitBulk() {
  const f = mgForm();

  f.bulkDraft = $('bulkInput').value;
  const rows = [], errors = [], seenE = {}, seenN = {};
  f.bulkDraft.split(/\r?\n/).forEach(function (line, idx) {
    if (!line.trim()) return;
    const no = 'Baris ' + (idx + 1) + ': ', c = line.split('|').map(function (x) { return x.trim(); });
    const name = (c[0] || '').replace(/\s+/g, ' '), rawId = (c[1] || '').toLowerCase(), email = idToEmail(rawId), r = parseBulkRole(c[2]);
    const pw = c[3] || '', wa = c[4] || '', g = (c[5] || 'A').toUpperCase();
    if (pw && pw.length < 6) { errors.push(no + 'password minimal 6 karakter (atau kosongkan untuk password acak).'); return; }
    if (!name) { errors.push(no + 'nama kosong.'); return; }
    if (!isValidLoginId(rawId)) { errors.push(no + 'ID "' + rawId + '" tidak valid.'); return; }
    if (!r) { errors.push(no + 'role "' + (c[2] || '') + '" tidak dikenal (pakai CS, SPV, Manager, atau Marketing).'); return; }
    if (seenE[email]) { errors.push(no + 'ID ' + rawId + ' dobel di daftar.'); return; }
    if (usersData.some(function (u) { return String(u.email || '').toLowerCase() === email; })) { errors.push(no + 'ID ' + rawId + ' sudah dipakai.'); return; }
    seenE[email] = true;
    if (r === 'Marketing') {
      if (validateWaNumber(wa)) { errors.push(no + 'No WA "' + wa + '" tidak valid.'); return; }
      if (g !== 'A' && g !== 'B') { errors.push(no + 'grup harus A atau B.'); return; }
      const k = name.toLowerCase();
      if (seenN[k] || usersData.some(function (u) { return u.role === 'Marketing' && String(u.name || '').trim().toLowerCase() === k; })) { errors.push(no + 'nama marketing "' + name + '" sudah dipakai (harus unik).'); return; }
      seenN[k] = true;
    }
    rows.push({ name: name, email: email, role: r, password: pw, waNumber: wa, group: g === 'B' ? 'B' : 'A' });
  });
  if (!rows.length && !errors.length) errors.push('Daftar masih kosong.');
  if (errors.length) { f.err = 'Perbaiki dulu:\n' + errors.join('\n'); renderSheet(); return; }

  if (!confirm('Buat ' + rows.length + ' akun sekarang? (' + summary + ')')) return;
  f.err = ''; mgBusy(true, 'bulkBtn');
  let order = nextRotationOrder();
  const results = [];
  rows.reduce(function (prev, row, i) {
    return prev.then(function () {
      if ($('bulkBtn')) $('bulkBtn').textContent = 'Membuat akun ' + (i + 1) + ' dari ' + rows.length + '…';
      const pw = row.password || randomPassword();
      const profile = { name: row.name, email: row.email, role: row.role, active: true, createdAt: FieldValue.serverTimestamp(), createdBy: currentUser.uid, updatedAt: FieldValue.serverTimestamp() };
      if (row.role === 'Marketing') Object.assign(profile, { waNumber: row.waNumber, group: row.group, inRotation: true, rotationOrder: order++ });
      return createLoginAccount(row.email, pw, profile).then(function () { results.push(Object.assign({ ok: true, password: pw }, row)); })
        .catch(function (e) { results.push(Object.assign({ ok: false, error: authErrorMessage(e) }, row)); });
    });

function acceptLead(leadId, btn) {
  if (role !== 'marketing') return;
  if (btn) { btn.disabled = true; btn.textContent = 'Memproses…'; }
  const ref = db.collection('leads').doc(leadId);
  let accepted = null;
  db.runTransaction(function (tx) {
    return tx.get(ref).then(function (snap) {
      if (!snap.exists) throw new Error('LEAD_MOVED');
      const d = snap.data();
      if (d.assignedTo !== currentUser.name) throw new Error('LEAD_MOVED');
      accepted = Object.assign({ id: leadId }, d, { pendingAccept: false });
      if (d.pendingAccept !== true) return;
      tx.update(ref, { pendingAccept: false, acceptedAt: FieldValue.serverTimestamp(), acceptedBy: currentUser.name, acceptedLate: Date.now() > acceptDeadlineMs(d) });
    });
  }).then(function () {
    logMarketingActivity('Terima lead', accepted.buyerName, leadId, '');
    callNotify('lead-accepted', leadId);
    openSheet('accepted', accepted);
  }).catch(function (err) {
    if (err && err.message === 'LEAD_MOVED') alert('Lead ini sudah dialihkan ke marketing lain karena melewati batas waktu 5 menit.');
    else alert('Gagal menerima lead: ' + (err && err.message));
    if (btn && document.body.contains(btn)) { btn.disabled = false; btn.textContent = 'Terima Lead'; }
  });
}

function saveUpdateV2(id) {
  captureUpd();
  const f = sheetState.form, l = findLeadById(id);
  if (!l) return;
  const note = (f.note || '').trim();
  if (!note) { alert('Catatan update wajib diisi supaya tim tahu perkembangan di tahap ini.'); return; }
  const newStatus = f.status;
  const visitDate = f.visitDate || '', visitTime = visitDate ? (f.visitTime || '') : '';
  const visitChanged = visitDate !== (l.visitDate || '') || visitTime !== (l.visitTime || '');
  if (!visitDate && f.visitTime && visitChanged) { alert('Isi tanggal janji kunjungan dulu (jam boleh kosong).'); return; }
  if (visitChanged && visitDate && visitDate < toDateInputValue(new Date())) { alert('Tanggal janji kunjungan sudah lewat.'); return; }
  const historyEntry = { date: new Date(), status: newStatus, note: note };
  if (visitChanged) historyEntry.visit = visitDate ? formatVisit(visitDate, visitTime) : 'dibatalkan';
  const key = closingKeyForStatus(newStatus);
  let cProject = '', cUnit = '', cNominal = '';
  if (key) {
    cProject = $('updProj').value; cUnit = $('updUnit').value.trim(); cNominal = formatRupiahDigits($('updNominal').value);
    if (!cProject) { alert('Pilih proyek yang closing.'); return; }
    if (!cUnit) { alert('Isi Unit / Blok yang closing supaya SPV/Manager bisa memverifikasi.'); return; }
    historyEntry.closingProject = cProject; historyEntry.unit = cUnit; if (cNominal) historyEntry.nominal = cNominal;
  }
  const prev = key ? ((l.closingInfo || {})[key] || null) : null;
  const closingChanged = !!key && (!prev || prev.project !== cProject || prev.unit !== cUnit || formatRupiahDigits(prev.nominal) !== cNominal);
  const payload = { status: newStatus, nextFollowUpDate: fromDateInputValue(f.next), lastUpdated: FieldValue.serverTimestamp(), notes: FieldValue.arrayUnion(historyEntry) };
  if (closingChanged) payload['closingInfo.' + key] = { project: cProject, unit: cUnit, nominal: cNominal, at: new Date() };
  if (visitChanged && visitDate) { payload.visitDate = visitDate; payload.visitTime = visitTime; payload.visitSetAt = FieldValue.serverTimestamp(); payload.visitSetBy = currentUser.name; }
  else if (visitChanged) { payload.visitDate = FieldValue.delete(); payload.visitTime = FieldValue.delete(); payload.visitCancelled = formatVisit(l.visitDate, l.visitTime); payload.visitCancelledAt = FieldValue.serverTimestamp(); }
  const btn = $('updSave'); if (btn) { btn.disabled = true; btn.textContent = 'Menyimpan…'; }
  const oldStatus = l.status || '-';
  db.collection('leads').doc(id).update(payload).then(function () {
    waIndexPut(id, Object.assign({}, l, { status: newStatus, notes: (Array.isArray(l.notes) ? l.notes : []).concat([historyEntry]) }));
    logMarketingActivity('Update status ke ' + newStatus, l.buyerName, id, oldStatus + ' → ' + newStatus + ' · Catatan: ' + (note.length > 120 ? note.slice(0, 120) + '...' : note));
    if (closingChanged) callNotify('closing-submitted', id, { stage: key });
    if (visitChanged) {
      callNotify(visitDate ? 'visit-scheduled' : 'visit-cancelled', id);
      logMarketingActivity(visitDate ? 'Janji kunjungan' : 'Batalkan kunjungan', l.buyerName, id, visitDate ? formatVisit(visitDate, visitTime) : (formatVisit(l.visitDate, l.visitTime) || '-'));
    }
    closeSheet(); toast('Status tersimpan', l.buyerName + ' → ' + newStatus); afterKpiChange();
  }).catch(function (err) { alert('Gagal memperbarui status: ' + err.message); if (btn) { btn.disabled = false; btn.textContent = 'Simpan'; } });
}

  db.collection('leads').doc(leadId).update(upd).then(function () {
    callNotify('closing-verified', leadId, { stage: key });

function registerPushToken() {
  if (!currentUser || pushUnsupportedReason() || Notification.permission !== 'granted') return Promise.resolve(null);
  return getPushSwRegistration().then(function (reg) {
    if (!pushMessaging) pushMessaging = firebase.messaging();
    if (!pushOnMessageBound) {
      pushOnMessageBound = true;
      pushMessaging.onMessage(function (payload) {
        const kind = (payload.data && payload.data.kind) || '';
        if (kind === 'lead-pending' || kind === 'lead-warn') return;
        const n = payload.notification || payload.data || {};
        toast(n.title || 'Notifikasi', n.body || '');
        recordNotif(kind === 'broadcast' || kind.indexOf('lead') === 0 ? 'new' : 'followup', n.title || 'Notifikasi', n.body || '', (payload.data && payload.data.leadId) || null);
      });
    }
    return pushMessaging.getToken({ vapidKey: APP.firebase.vapidKey, serviceWorkerRegistration: reg });
  }).then(function (token) {
    if (!token || !currentUser) return null;
    try { localStorage.setItem(PUSH_TOKEN_STORE_KEY, token); } catch (e) {}
    return db.collection('pushTokens').doc(currentUser.uid).set({ uid: currentUser.uid, name: currentUser.name, role: currentUser.role, tokens: FieldValue.arrayUnion(token), updatedAt: FieldValue.serverTimestamp() }, { merge: true })
      .then(function () { return token; });
  }).catch(function (err) { console.error('Gagal mendaftarkan push:', err); return null; })

}
function enablePush() {

  if (reason) { alert(reason); return; }

    if (perm !== 'granted') { alert('Izin notifikasi ditolak. Izinkan Notifikasi di pengaturan situs browser.'); rerender(); return; }

  });
}
function initPush() { if ('Notification' in window && Notification.permission === 'granted') registerPushToken(); }
